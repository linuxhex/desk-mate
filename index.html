<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeskMate - 智能办公助手</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
      background: #ffffff;
      color: #24292f;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    .container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    
    .sidebar {
      width: 260px;
      background: #ffffff;
      border-right: 1px solid #e1e4e8;
      display: flex;
      flex-direction: column;
      padding: 16px;
      transition: all 0.3s ease;
      position: relative;
    }
    
    .sidebar.collapsed {
      width: 60px;
      padding: 16px 8px;
    }
    
    .sidebar.collapsed .sidebar-item span:last-child {
      display: none;
    }
    
    .sidebar-toggle {
      position: absolute;
      top: 50%;
      right: -12px;
      transform: translateY(-50%);
      width: 24px;
      height: 24px;
      background: #ffffff;
      border: 1px solid #d0d7de;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #57606a;
      font-size: 12px;
      z-index: 100;
      transition: all 0.2s ease;
    }
    
    .sidebar-toggle:hover {
      background: #f6f8fa;
      color: #24292f;
    }
    
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    
    .header {
      padding: 16px 20px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      z-index: 10;
    }
    
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 600;
    }
    
    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      min-height: 0;
    }
    
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scrollbar-width: none;
      -ms-overflow-style: none;
      min-height: 0;
    }
    
    .messages::-webkit-scrollbar {
      display: none;
    }
    
    .message {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 8px;
      animation: fadeIn 0.3s ease;
      line-height: 1.6;
    }
    
    .message.user {
      align-self: flex-end;
      background: #1f6feb;
      color: #ffffff;
      border-radius: 8px 8px 0 8px;
    }
    
    .message.ai {
      align-self: flex-start;
      background: #f6f8fa;
      border: 1px solid #d0d7de;
      border-radius: 8px 8px 8px 0;
      color: #24292f;
    }
    
    .input-container {
      padding: 16px 20px;
      background: #ffffff;
      border-top: 1px solid #e1e4e8;
      flex-shrink: 0;
    }
    
    .input-wrapper {
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }
    
    .chat-input {
      flex: 1;
      padding: 12px 16px;
      background: #f6f8fa;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      color: #24292f;
      font-size: 14px;
      font-family: inherit;
      resize: none;
      min-height: 44px;
      max-height: 120px;
    }
    
    .chat-input:focus {
      outline: none;
      border-color: #0969da;
      box-shadow: 0 0 0 2px rgba(9, 105, 218, 0.2);
    }
    
    .chat-input::placeholder {
      color: #57606a;
    }
    
    .send-btn {
      padding: 12px 24px;
      background: #238636;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      height: 44px;
    }
    
    .send-btn:hover {
      background: #2ea043;
    }
    
    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .sidebar-item {
      padding: 10px 12px;
      margin-bottom: 4px;
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #24292f;
      font-size: 14px;
    }
    
    .sidebar-item:hover {
      background: #f6f8fa;
      color: #24292f;
    }
    
    .sidebar-item.active {
      background: #ddf4ff;
      color: #0969da;
    }
    
    .sidebar-icon {
      font-size: 16px;
    }
    
    .file-list {
      margin-top: 16px;
      padding: 12px;
      background: transparent;
      border-radius: 6px;
      border: none;
    }
    
    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px;
      margin-bottom: 6px;
      background: #f6f8fa;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
      color: #24292f;
    }
    
    .file-item:hover {
      background: #eaeef2;
    }
    
    .file-item.active {
      background: #ddf4ff;
      color: #0969da;
    }
    
    .file-name {
      color: #24292f;
      font-weight: 500;
    }
    
    .file-size {
      color: #57606a;
      font-size: 12px;
    }
    
    .status-bar {
      padding: 8px 16px;
      background: #ffffff;
      border-top: 1px solid #e1e4e8;
      font-size: 12px;
      color: #57606a;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      z-index: 10;
    }
    
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #238636;
    }
    
    .status-dot.offline {
      background: #da3633;
    }
    
    .loading {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px;
      background: rgba(88, 166, 255, 0.1);
      border-radius: 6px;
    }
    
    .loading-spinner {
      width: 16px;
      height: 16px;
      border: 2px solid #58a6ff;
      border-top: 2px solid transparent;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .platform-webview {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
      display: none;
      z-index: 5;
      overflow: hidden;
    }
    
    .platform-webview.active {
      display: flex;
      flex-direction: column;
    }
    
    /* 千问平台适配 */
    #webview-qwen {
      /* 千问平台已经适配好了 */
    }
    
    /* DeepSeek平台适配 */
    #webview-deepseek {
      padding-top: 0;
    }
    
    /* Kimi平台适配 */
    #webview-kimi {
      padding-top: 0;
    }
    
    /* 元宝平台适配 */
    #webview-yuanbao {
      padding-top: 0;
    }
    
    /* 豆包平台适配 */
    #webview-doubao {
      padding-top: 0;
    }
    
    .return-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 1000;
      padding: 8px 16px;
      background: #238636;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: none;
    }
    
    .return-btn:hover {
      background: #2ea043;
    }
    
    .return-btn.active {
      display: block;
    }
    
    .platform-info {
      padding: 8px 12px;
      background: #21262d;
      border-radius: 6px;
      margin-bottom: 8px;
      font-size: 12px;
      color: #8b949e;
    }
    
    .platform-name {
      font-weight: 600;
      color: #58a6ff;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="sidebar" id="sidebar">
      <button class="sidebar-toggle" onclick="toggleSidebar()">◀</button>
      
      <div id="platform-selector"></div>
      
      <div class="sidebar-item active" onclick="showChat()">
        <span class="sidebar-icon">💬</span>
        <span>本地模型</span>
      </div>
    </div>
    
    <div class="main-content">
      <div class="chat-container" id="chat-container">
        <div class="messages" id="messages"></div>
        
        <div class="input-container">
          <div class="input-wrapper">
            <textarea class="chat-input" id="chat-input" placeholder="输入您的消息..." rows="1"></textarea>
            <button class="send-btn" id="send-btn" onclick="sendMessage()">发送</button>
          </div>
        </div>
        
        <webview id="webview-qwen" class="platform-webview" src="https://qianwen.aliyun.com/" partition="persist:qwen" allowpopups useragent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"></webview>
        <webview id="webview-deepseek" class="platform-webview" src="https://chat.deepseek.com/" partition="persist:deepseek" allowpopups useragent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"></webview>
        <webview id="webview-kimi" class="platform-webview" src="https://kimi.moonshot.cn/" partition="persist:kimi" allowpopups useragent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"></webview>
        <webview id="webview-yuanbao" class="platform-webview" src="https://yuanbao.tencent.com/" partition="persist:yuanbao" allowpopups useragent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"></webview>
        <webview id="webview-doubao" class="platform-webview" src="https://doubao.com/" partition="persist:doubao" allowpopups useragent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"></webview>
      </div>
    </div>
  </div>
  
  <script>
    // AI平台配置
    const AI_PLATFORMS = {
      'qwen': {
        name: '千问（Qwen）',
        url: 'https://tongyi.aliyun.com/qianwen/',
        description: '中文理解能力强，适合办公场景',
        strengths: ['Excel数据分析', '中文文档处理', '办公任务'],
        icon: 'icons/qwen.png'
      },
      'deepseek': {
        name: 'DeepSeek',
        url: 'https://chat.deepseek.com/',
        description: '代码能力强，适合技术任务',
        strengths: ['代码生成', '技术问题解决', '编程辅助'],
        icon: 'icons/deepseek.png'
      },
      'kimi': {
        name: 'Kimi',
        url: 'https://kimi.moonshot.cn/',
        description: '长文本处理能力强，适合文档分析',
        strengths: ['长文档分析', '内容总结', '深度理解'],
        icon: 'icons/moonshot.png'
      },
      'yuanbao': {
        name: '元宝',
        url: 'https://yuanbao.tencent.com/',
        description: '综合能力强，适合多场景',
        strengths: ['多任务处理', '智能对话', '内容创作'],
        icon: 'icons/yuanbao.png'
      },
      'doubao': {
        name: '豆包',
        url: 'https://doubao.com/',
        description: '交互能力强，适合日常对话',
        strengths: ['日常对话', '知识问答', '娱乐互动'],
        icon: 'icons/doubao.png'
      }
    };
    
    let currentPlatform = localStorage.getItem('current_platform') || 'qwen';
    let selectedFiles = [];
    let conversationHistory = JSON.parse(localStorage.getItem('conversation_history') || '[]');
    let isProcessing = false;
    let sidebarCollapsed = localStorage.getItem('sidebar_collapsed') === 'true';
    
    // 切换侧边栏
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const toggleBtn = document.querySelector('.sidebar-toggle');
      
      sidebarCollapsed = !sidebarCollapsed;
      localStorage.setItem('sidebar_collapsed', sidebarCollapsed);
      
      if (sidebarCollapsed) {
        sidebar.classList.add('collapsed');
        toggleBtn.textContent = '▶';
      } else {
        sidebar.classList.remove('collapsed');
        toggleBtn.textContent = '◀';
      }
    }
    
    // 保存对话历史到localStorage
    function saveConversationHistory() {
      localStorage.setItem('conversation_history', JSON.stringify(conversationHistory));
    }
    
    // 清空对话历史
    function clearConversationHistory() {
      conversationHistory = [];
      saveConversationHistory();
      document.getElementById('messages').innerHTML = '';
      addMessage('ai', '✅ 对话历史已清空');
    }
    
    // 导出对话历史
    function exportConversationHistory() {
      const historyText = conversationHistory
        .filter(msg => msg.type !== 'loading')
        .map(msg => `${msg.type === 'user' ? '用户' : 'AI'}: ${msg.content}`)
        .join('\n\n');
      
      const blob = new Blob([historyText], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `对话历史_${new Date().toISOString().slice(0, 10)}.txt`;
      a.click();
      URL.revokeObjectURL(url);
      
      addMessage('ai', '✅ 对话历史已导出');
    }
    
    // 初始化平台选择器
    function initPlatformSelector() {
      const platformSelector = document.getElementById('platform-selector');
      platformSelector.innerHTML = '';
      
      Object.keys(AI_PLATFORMS).forEach(platformKey => {
        const platform = AI_PLATFORMS[platformKey];
        const isActive = platformKey === currentPlatform;
        
        const platformItem = document.createElement('div');
        platformItem.className = 'sidebar-item' + (isActive ? ' active' : '');
        platformItem.innerHTML = `
          <img src="${platform.icon}" class="sidebar-icon" style="width: 20px; height: 20px; border-radius: 4px;" onerror="this.style.display='none'">
          <span>${platform.name}</span>
        `;
        
        platformItem.onclick = () => selectPlatform(platformKey);
        platformSelector.appendChild(platformItem);
      });
    }
    
    // 选择平台
    function selectPlatform(platformKey) {
      currentPlatform = platformKey;
      localStorage.setItem('current_platform', platformKey);
      initPlatformSelector();
      
      // 隐藏所有webview
      Object.keys(AI_PLATFORMS).forEach(key => {
        const webview = document.getElementById(`webview-${key}`);
        if (webview) {
          webview.classList.remove('active');
        }
      });
      
      // 显示选中的webview
      const webview = document.getElementById(`webview-${platformKey}`);
      if (webview) {
        webview.classList.add('active');
        // 隐藏messages和input-container，而不是整个chat-container
        document.getElementById('messages').style.display = 'none';
        document.querySelector('.input-container').style.display = 'none';
        document.getElementById('return-btn').classList.add('active');
      }
    }
    
    // 显示对话界面
    function showChat() {
      // 隐藏所有webview
      Object.keys(AI_PLATFORMS).forEach(key => {
        const webview = document.getElementById(`webview-${key}`);
        if (webview) {
          webview.classList.remove('active');
        }
      });
      
      // 显示对话界面
      document.getElementById('messages').style.display = 'flex';
      document.querySelector('.input-container').style.display = 'block';
      document.getElementById('return-btn').classList.remove('active');
    }
    
    // 智能推荐平台
    function recommendPlatform(message) {
      const messageLower = message.toLowerCase();
      
      if (messageLower.includes('代码') || messageLower.includes('编程') || messageLower.includes('bug') || messageLower.includes('debug')) {
        return 'deepseek';
      } else if (messageLower.includes('文档') || messageLower.includes('总结') || messageLower.includes('长文本') || messageLower.includes('论文')) {
        return 'kimi';
      } else if (messageLower.includes('日常') || messageLower.includes('聊天') || messageLower.includes('娱乐') || messageLower.includes('闲聊')) {
        return 'doubao';
      } else if (messageLower.includes('创作') || messageLower.includes('写作') || messageLower.includes('文案') || messageLower.includes('内容')) {
        return 'yuanbao';
      } else {
        return 'qwen';
      }
    }
    
    // 添加消息到聊天界面
    function addMessage(type, content) {
      const messagesDiv = document.getElementById('messages');
      const messageDiv = document.createElement('div');
      messageDiv.className = 'message ' + type;
      
      if (type === 'loading') {
        messageDiv.innerHTML = `
          <div class="loading">
            <div class="loading-spinner"></div>
            <span>${content}</span>
          </div>
        `;
      } else {
        messageDiv.innerHTML = `<div style="font-size: 14px; white-space: pre-wrap;">${content}</div>`;
      }
      
      messagesDiv.appendChild(messageDiv);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
      
      conversationHistory.push({
        type: type,
        content: content,
        timestamp: new Date()
      });
      
      // 保存对话历史到localStorage
      if (type !== 'loading') {
        saveConversationHistory();
      }
      
      return messageDiv;
    }
    
    // 更新状态
    function updateStatus(status, text) {
      const statusDot = document.getElementById('status-dot');
      const statusText = document.getElementById('status-text');
      
      statusDot.className = 'status-dot ' + (status === 'offline' ? 'offline' : '');
      statusText.textContent = text;
    }
    
    // 发送消息
    async function sendMessage() {
      if (isProcessing) {
        return;
      }
      
      const input = document.getElementById('chat-input');
      const message = input.value.trim();
      
      if (!message) {
        return;
      }
      
      // 添加用户消息
      addMessage('user', message);
      input.value = '';
      
      // 智能推荐平台
      const recommendedPlatform = recommendPlatform(message);
      if (recommendedPlatform !== currentPlatform) {
        const platform = AI_PLATFORMS[recommendedPlatform];
        addMessage('ai', `💡 根据您的需求，推荐使用 ${platform.name} 平台（${platform.description}）`);
        addMessage('ai', `正在为您打开 ${platform.name} 平台...`);
        // 切换平台，但保持对话内容不变
        currentPlatform = recommendedPlatform;
        localStorage.setItem('current_platform', recommendedPlatform);
        initPlatformSelector();
      }
      
      // 提示用户切换到平台
      addMessage('ai', `💡 请在 ${AI_PLATFORMS[currentPlatform].name} 平台中继续对话`);
      selectPlatform(currentPlatform);
    }
    
    // 上传文件
    async function uploadFiles() {
      try {
        const result = await window.electronAPI.openFileDialog();
        if (result) {
          const file = {
            name: result.split(/[/\\]/).pop(),
            path: result
          };
          selectedFiles.push(file);
          addMessage('ai', `✅ 已上传文件: ${file.name}`);
        }
      } catch (error) {
        console.error('上传文件失败:', error);
        addMessage('ai', '❌ 上传文件失败: ' + error.message);
      }
    }
    
    // 初始化
    window.addEventListener('DOMContentLoaded', function() {
      initPlatformSelector();
      
      // 恢复侧边栏状态
      if (sidebarCollapsed) {
        const sidebar = document.getElementById('sidebar');
        const toggleBtn = document.querySelector('.sidebar-toggle');
        sidebar.classList.add('collapsed');
        toggleBtn.textContent = '▶';
      }
      
      // 加载之前的对话历史
      if (conversationHistory.length > 0) {
        conversationHistory.forEach(msg => {
          if (msg.type !== 'loading') {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ' + msg.type;
            messageDiv.innerHTML = `<div style="font-size: 14px; white-space: pre-wrap;">${msg.content}</div>`;
            messagesDiv.appendChild(messageDiv);
          }
        });
        addMessage('ai', '✅ 已加载之前的对话历史');
      } else {
        addMessage('ai', '👋 你好！我是DeskMate，你的智能办公助手。');
        addMessage('ai', '我可以帮你处理以下任务：');
        addMessage('ai', '• 📊 数据分析和处理');
        addMessage('ai', '• 📄 文档处理和转换');
        addMessage('ai', '• 💻 代码编写和调试');
        addMessage('ai', '• 📝 内容创作和总结');
        addMessage('ai', '• ❓ 问题解答和建议');
        addMessage('ai', '');
        addMessage('ai', '🤖 支持多个AI平台：千问、DeepSeek、Kimi、元宝、豆包');
        addMessage('ai', '💡 系统会根据你的需求自动推荐最适合的平台');
        addMessage('ai', '');
        addMessage('ai', '请告诉我你的需求，我会帮你打开最适合的平台！');
      }
      
      updateStatus('ready', '就绪');
    });
    
    // 监听回车键
    document.getElementById('chat-input').addEventListener('keypress', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
    
    // 监听窗口大小变化，调整webview大小
    window.addEventListener('resize', function() {
      adjustWebviewSize();
    });
    
    // 调整webview大小
    function adjustWebviewSize() {
      const header = document.querySelector('.header');
      const statusBar = document.querySelector('.status-bar');
      const mainContent = document.querySelector('.main-content');
      
      if (header && statusBar && mainContent) {
        const headerHeight = header.offsetHeight;
        const statusBarHeight = statusBar.offsetHeight;
        const mainContentHeight = mainContent.offsetHeight;
        
        const webviewHeight = mainContentHeight - headerHeight - statusBarHeight;
        
        console.log('调整webview大小:', {
          headerHeight,
          statusBarHeight,
          mainContentHeight,
          webviewHeight
        });
        
        Object.keys(AI_PLATFORMS).forEach(key => {
          const webview = document.getElementById(`webview-${key}`);
          if (webview) {
            webview.style.top = `${headerHeight}px`;
            webview.style.height = `${webviewHeight}px`;
          }
        });
      }
    }
    
    // 初始化时调整webview大小
    window.addEventListener('DOMContentLoaded', function() {
      setTimeout(adjustWebviewSize, 100);
    });
  </script>
</body>
</html>
