<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>桌面Excel分析助手</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
      min-height: 100vh;
      overflow: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 20px;
      max-width: 1800px;
      margin: 0 auto;
    }

    .chat-panel {
      flex: 1;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 800px;
    }

    .main-content {
      display: flex;
      flex: 1;
      gap: 20px;
      margin-bottom: 20px;
      min-height: 0;
      z-index: 5;
    }

    .left-panel {
      flex: 1;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 400px;
    }

    .chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      background: #fafafa;
    }

    .message {
      margin-bottom: 15px;
      padding: 12px 16px;
      border-radius: 12px;
      animation: fadeIn 0.3s ease;
      max-width: 80%;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .user-message {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      align-self: flex-end;
      margin-left: auto;
      box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
    }

    .ai-message {
      background: white;
      color: #1a1a2e;
      align-self: flex-start;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      border: 1px solid #e0e0e0;
    }

    .chat-input-area {
      padding: 20px;
      border-top: 1px solid #e0e0e0;
      background: white;
      position: relative;
    }

    .input-container {
      position: relative;
      margin-bottom: 10px;
    }

    .file-upload-btn {
      margin-bottom: 10px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .file-upload-btn:hover {
      background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .upload-icon {
      font-size: 16px;
    }

    .upload-text {
      font-size: 14px;
    }

    .chat-input {
      width: 100%;
      min-height: 120px;
      padding: 15px 260px 15px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      resize: vertical;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
      background: white;
    }

    .chat-input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
    }

    .send-btn {
      position: absolute;
      bottom: 10px;
      right: 10px;
      z-index: 15;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 24px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
    }

    .send-btn:hover {
      background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .send-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .file-list {
      margin: 10px 0 20px 0;
      padding: 10px;
      background: #f8f9fa;
      border-radius: 8px;
      border: 1px solid #e0e0e0;
      max-height: 120px;
      overflow-y: auto;
    }

    .file-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
      margin-bottom: 6px;
      background: white;
      border-radius: 4px;
      border: 1px solid #e0e0e0;
      font-size: 12px;
    }

    .file-item:hover {
      background: #f0f4ff;
      border-color: #667eea;
    }

    .file-name {
      flex: 1;
      color: #333;
      font-weight: 500;
    }

    .remove-file {
      background: #ff6b6b;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 2px 8px;
      cursor: pointer;
      font-size: 10px;
      font-weight: 600;
      transition: background 0.3s ease;
    }

    .remove-file:hover {
      background: #ff5252;
    }

    .right-panel {
      flex: 1;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 400px;
    }

    .result-header {
      padding: 20px;
      border-bottom: 1px solid #e0e0e0;
      background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
    }

    .result-header h2 {
      font-size: 20px;
      font-weight: 600;
      color: #1a1a2e;
    }

    .result-content {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      background: #fafafa;
    }

    .chart-container {
      width: 100%;
      height: 400px;
      margin-bottom: 20px;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      background: white;
    }

    .analysis-result {
      background: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      border: 1px solid #e0e0e0;
    }

    .analysis-result h3 {
      color: #1a1a2e;
      margin-bottom: 15px;
      font-size: 16px;
      font-weight: 600;
    }

    .analysis-result p {
      color: #555;
      line-height: 1.6;
      margin-bottom: 10px;
    }

    .hidden {
      display: none;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
    }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #667eea;
      font-size: 14px;
      font-weight: 500;
    }

    .loading::after {
      content: '';
      width: 16px;
      height: 16px;
      margin-left: 10px;
      border: 2px solid #667eea;
      border-top: 2px solid transparent;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="main-content">
      <!-- 只保留对话框和输入框 -->
      <div class="chat-panel">
        <div class="chat-messages" id="chat-messages">
          <div class="message ai-message">
            你好！请上传Excel文件并告诉我你想要分析的内容�?          </div>
        </div>
        <div class="chat-input-area">
          <div class="file-list" id="file-list">
            <div class="file-info">未选择文件</div>
          </div>
          <div class="input-container">
            <label class="file-upload-btn" for="file-input">
              <input type="file" id="file-input" accept=".xlsx,.xls,.csv" multiple style="display: none;" onchange="handleFileSelect(event)">
              <span class="upload-icon">📁</span>
              <span class="upload-text">上传Excel</span>
            </label>
            <textarea class="chat-input" id="chat-input" placeholder="输入你的分析需�?.."></textarea>
            <button class="send-btn" id="send-btn" onclick="sendMessage()">发�?/button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Excel服务，使用xlsx库处理文�?    class ExcelService {
      static readExcelData(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = function(e) {
            try {
              // 模拟解析Excel数据，实际应用中会使用xlsx�?              const data = new Uint8Array(e.target.result);
              
              // 模拟解析结果，包含实际的列名
              const mockData = Array.from({ length: 10 }, (_, i) => ({
                id: i + 1,
                name: `项目${i + 1}`,
                value: Math.floor(Math.random() * 1000) + 100,
                category: ['A�?, 'B�?, 'C�?][Math.floor(Math.random() * 3)],
                date: new Date(Date.now() - Math.random() * 10000000000).toISOString().split('T')[0]
              }));
              
              // 模拟列名
              const columnNames = ['ID', '项目名称', '数�?, '类别', '日期'];
              
              resolve({
                success: true,
                data: mockData,
                columnNames: columnNames
              });
            } catch (error) {
              resolve({
                success: false,
                error: error.message
              });
            }
          };
          reader.onerror = function(error) {
            resolve({
              success: false,
              error: error.message
            });
          };
          reader.readAsArrayBuffer(file);
        });
      }
    }

    class MockAIService {
      static async analyzeExcel(data, query) {
        try {
          // 模拟AI分析
          await new Promise(resolve => setTimeout(resolve, 1500));
          return {
            success: true,
            content: `我已经分析了你的Excel数据，包�?${data.length} 条记录。\n\n**数据概览**：\n- 最大值：${Math.max(...data.map(item => item.value))}\n- 最小值：${Math.min(...data.map(item => item.value))}\n- 平均值：${Math.round(data.reduce((sum, item) => sum + item.value, 0) / data.length)}\n\n**分析结果**：\n数据呈现正态分布，建议重点关注值较高的记录。\n\n**建议**：\n可以进一步分析数据的趋势和相关性，以获得更深入的洞察。`
          };
        } catch (error) {
          return {
            success: false,
            error: error.message
          };
        }
      }

      static async analyzeMultipleExcel(dataList, fileList, columnNamesList, query) {
        try {
          // 模拟AI分析
          await new Promise(resolve => setTimeout(resolve, 1500));
          
          // 计算所有文件的数据总量
          const totalRecords = dataList.reduce((sum, data) => sum + data.length, 0);
          
          // 计算每个文件的统计信息，基于实际列名
          const fileStats = fileList.map((file, index) => {
            const data = dataList[index];
            const columnNames = columnNamesList[index];
            
            // 基于数值列计算统计信息
            const values = data.map(item => item.value);
            const maxValue = Math.max(...values);
            const minValue = Math.min(...values);
            const avgValue = Math.round(values.reduce((sum, val) => sum + val, 0) / values.length);
            
            // 统计类别分布
            const categoryCount = {};
            data.forEach(item => {
              categoryCount[item.category] = (categoryCount[item.category] || 0) + 1;
            });
            
            return {
              name: file.name,
              records: data.length,
              columnNames: columnNames,
              max: maxValue,
              min: minValue,
              avg: avgValue,
              categoryCount: categoryCount
            };
          });
          
          let content = `我已经分析了你的 ${dataList.length} 个Excel文件，总共包含 ${totalRecords} 条记录。\n\n`;
          
          // 添加每个文件的统计信息，基于实际列名
          content += '**各文件统计信�?*：\n';
          fileStats.forEach((stat, index) => {
            content += `${index + 1}. ${stat.name}\n`;
            content += `- 记录数：${stat.records}\n`;
            content += `- 数据列：${stat.columnNames.join(', ')}\n`;
            content += `- ${stat.columnNames[2]}（数值）统计：最大�?{stat.max}，最小�?{stat.min}，平均�?{stat.avg}\n`;
            content += `- ${stat.columnNames[3]}（类别）分布�?{Object.entries(stat.categoryCount).map(([k, v]) => `${k}:${v}个`).join(', ')}\n\n`;
          });
          
          // 添加联合分析结果
          content += '**联合分析结果**：\n';
          content += `- 数据总量�?{totalRecords} 条\n`;
          content += `- 文件数量�?{dataList.length} 个\n`;
          content += `- 平均每个文件记录数：${Math.round(totalRecords / dataList.length)}\n\n`;
          
          content += '**分析结果**：\n';
          content += '数据分布较为均匀，各文件数据量差异不大。\n';
          content += '建议重点关注值较高的记录，并分析各文件之间的相关性。\n\n';
          
          content += '**建议**：\n';
          content += '1. 可以进一步分析各文件之间的关联关系\n';
          content += '2. 考虑将多个文件的数据合并进行更全面的分析\n';
          content += '3. 可以设置阈值，筛选出重要的数据记录\n';
          
          return {
            success: true,
            content: content,
            fileStats: fileStats
          };
        } catch (error) {
          return {
            success: false,
            error: error.message
          };
        }
      }
    }

    // 大模型交互服�?- 支持与大模型的通信和多轮对�?    class LLMService {
      constructor(config = {}) {
        this.apiKey = config.apiKey || '';
        this.apiEndpoint = config.apiEndpoint || 'https://api.openai.com/v1/chat/completions';
        this.model = config.model || 'gpt-4';
        this.temperature = config.temperature || 0.7;
        this.maxTokens = config.maxTokens || 2000;
        this.conversationHistory = [];
        this.tools = [];
        this.systemPrompt = config.systemPrompt || this.getDefaultSystemPrompt();
      }

      // 获取默认系统提示�?      getDefaultSystemPrompt() {
        return `你是一个专业的办公智能助手，可以帮助用户处理各种办公任务�?
你的能力包括�?1. 分析Excel数据，提供数据洞察和建议
2. 处理文档，提取关键信�?3. 管理邮件，帮助撰写和发送邮�?4. 生成报告，总结工作内容
5. 回答问题，提供专业建�?
当用户提出请求时，你应该�?1. 理解用户的意图和需�?2. 分析可用的工具和资源
3. 制定执行计划
4. 调用相应的工具完成任�?5. 将结果以清晰易懂的方式呈现给用户

如果需要更多信息或资源，请主动询问用户。`;
      }

      // 设置系统提示�?      setSystemPrompt(prompt) {
        this.systemPrompt = prompt;
      }

      // 注册工具
      registerTool(tool) {
        this.tools.push(tool);
      }

      // 发送消息到大模�?      async sendMessage(userMessage, context = {}) {
        try {
          // 构建消息历史
          const messages = [
            { role: 'system', content: this.systemPrompt },
            ...this.conversationHistory,
            { role: 'user', content: this.formatMessage(userMessage, context) }
          ];

          // 如果有工具，添加工具定义
          const tools = this.tools.length > 0 ? this.tools.map(tool => ({
            type: 'function',
            function: {
              name: tool.name,
              description: tool.description,
              parameters: tool.parameters
            }
          })) : undefined;

          // 调用大模型API
          const response = await this.callLLMAPI(messages, tools);

          // 解析响应
          const result = this.parseResponse(response);

          // 更新对话历史
          this.conversationHistory.push({ role: 'user', content: userMessage });
          this.conversationHistory.push({ role: 'assistant', content: result.content });

          // 保持对话历史在合理范围内
          if (this.conversationHistory.length > 20) {
            this.conversationHistory = this.conversationHistory.slice(-20);
          }

          return result;
        } catch (error) {
          console.error('调用大模型失�?', error);
          throw new Error(`调用大模型失�? ${error.message}`);
        }
      }

      // 格式化消�?      formatMessage(message, context) {
        let formattedMessage = message;

        // 添加上下文信�?        if (context.files && context.files.length > 0) {
          formattedMessage += `\n\n可用文件�?{context.files.map(f => f.name).join(', ')}`;
        }

        if (context.dataList && context.dataList.length > 0) {
          formattedMessage += `\n\n数据概览：共 ${context.dataList.length} 个文件，${context.dataList.reduce((sum, data) => sum + data.length, 0)} 条记录`;
        }

        return formattedMessage;
      }

      // 调用大模型API
      async callLLMAPI(messages, tools) {
        // 这里是模拟调用，实际应用中需要替换为真实的大模型API调用
        await new Promise(resolve => setTimeout(resolve, 1000));

        // 模拟响应
        const lastUserMessage = messages[messages.length - 1].content;
        
        // 简单的关键词匹配，模拟大模型的响应
        if (lastUserMessage.includes('分析') && lastUserMessage.includes('Excel')) {
          return {
            content: '我可以帮你分析Excel数据。请告诉我你想要分析的具体内容，比如数据统计、趋势分析、相关性分析等�?,
            toolCalls: []
          };
        } else if (lastUserMessage.includes('生成') && lastUserMessage.includes('报告')) {
          return {
            content: '我可以帮你生成报告。请提供报告的主题、格式要求，以及需要包含的内容�?,
            toolCalls: []
          };
        } else if (lastUserMessage.includes('发�?) && lastUserMessage.includes('邮件')) {
          return {
            content: '我可以帮你发送邮件。请提供收件人、邮件主题和邮件内容�?,
            toolCalls: []
          };
        } else {
          return {
            content: '我理解你的需求。让我帮你处理这个任务。请提供更多详细信息，以便我能够更好地帮助你�?,
            toolCalls: []
          };
        }
      }

      // 解析响应
      parseResponse(response) {
        return {
          content: response.content,
          toolCalls: response.toolCalls || [],
          finishReason: response.finishReason || 'stop'
        };
      }

      // 执行工具调用
      async executeToolCalls(toolCalls, context = {}) {
        const results = [];

        for (const toolCall of toolCalls) {
          const tool = this.tools.find(t => t.name === toolCall.name);
          if (tool) {
            try {
              const result = await tool.execute(toolCall.arguments, context);
              results.push({
                name: toolCall.name,
                result: result,
                status: 'success'
              });
            } catch (error) {
              results.push({
                name: toolCall.name,
                error: error.message,
                status: 'failure'
              });
            }
          }
        }

        return results;
      }

      // 多轮对话执行
      async executeMultiTurnConversation(userMessage, context = {}, maxTurns = 5) {
        const results = [];
        let currentMessage = userMessage;
        let turn = 0;

        while (turn < maxTurns) {
          turn++;

          // 发送消息到大模�?          const response = await this.sendMessage(currentMessage, context);
          results.push({
            turn: turn,
            type: 'llm_response',
            content: response.content
          });

          // 如果有工具调用，执行工具
          if (response.toolCalls && response.toolCalls.length > 0) {
            const toolResults = await this.executeToolCalls(response.toolCalls, context);
            results.push({
              turn: turn,
              type: 'tool_execution',
              results: toolResults
            });

            // 将工具执行结果发送回大模�?            const toolSummary = toolResults.map(r => 
              `${r.name}: ${r.status === 'success' ? '成功' : '失败'} - ${r.status === 'success' ? JSON.stringify(r.result) : r.error}`
            ).join('\n');
            
            currentMessage = `工具执行结果：\n${toolSummary}\n\n请基于这些结果继续处理任务。`;
          } else {
            // 没有工具调用，对话结�?            break;
          }
        }

        return results;
      }

      // 清空对话历史
      clearHistory() {
        this.conversationHistory = [];
      }

      // 获取对话历史
      getHistory() {
        return this.conversationHistory;
      }
    }

    let selectedFiles = [];
    let excelDataList = [];
    let columnNamesList = [];
    let chart = null;

    function openFileDialog() {
      const fileInput = document.getElementById('file-input');
      // 重置input的值，确保每次点击都能触发onchange事件，即使选择相同的文�?      fileInput.value = '';
      fileInput.click();
    }

    function handleFileSelect(event) {
      console.log('handleFileSelect函数被调�?);
      try {
        const files = event.target.files;
        console.log('获取到文�?', files);
        if (files.length > 0) {
          addMessage('ai', '读取文件�?..');
          
          // 模拟读取文件

    function generateNewExcel(fileStats, options = {}) {
      return new Promise((resolve, reject) => {
        try {
          console.log('开始生成Excel文件，文件统�?', fileStats, '选项:', options);
          
          // 模拟生成Excel文件，实际应用中会使用xlsx�?          const timestamp = new Date().getTime();
          const filename = options.filename || `分析结果_${timestamp}.xlsx`;
          const newExcelPath = `C:/Users/${window.navigator.userAgent.split('Windows NT')[1] ? 'User' : '王玉�?}/Desktop/${filename}`;
          
          console.log('生成文件路径:', newExcelPath);
          
          // 合并所有文件的数据，保持列名一�?          const mergedData = [];
          let allColumnNames = options.columns || ['ID', '项目名称', '数�?, '类别', '日期', '来源文件'];
          
          // 如果用户指定了自定义列名，则使用用户指定的列�?          if (options.customColumns) {
            allColumnNames = options.customColumns;
          }
          
          // 支持列映射功�?          const columnMapping = options.columnMapping || {};
          
          fileStats.forEach((stat, fileIndex) => {
            const data = excelDataList[fileIndex];
            console.log(`处理文件 ${fileIndex}:`, stat.name, '数据�?', data.length);
            data.forEach(item => {
              const rowData = {
                id: item.id,
                name: item.name,
                value: item.value,
                category: item.category,
                date: item.date,
                source: stat.name
              };
              
              // 应用列映�?              Object.keys(columnMapping).forEach(sourceCol => {
                const targetCol = columnMapping[sourceCol];
                if (rowData.hasOwnProperty(sourceCol)) {
                  rowData[targetCol] = rowData[sourceCol];
                }
              });
              
              // 如果用户指定了数据转换规则，则应用转�?              if (options.transformRules) {
                Object.keys(options.transformRules).forEach(key => {
                  if (rowData.hasOwnProperty(key)) {
                    const rule = options.transformRules[key];
                    switch (rule.type) {
                      case 'format':
                        // 应用格式化规�?                        if (rule.pattern) {
                          rowData[key] = rule.pattern.replace('{value}', rowData[key]);
                        }
                        break;
                      case 'calculate':
                        // 应用计算规则
                        if (rule.formula) {
                          // 支持更复杂的公式计算
                          switch (rule.formula) {
                            case 'value * 2':
                              rowData[key] = rowData[key] * 2;
                              break;
                            case 'value / 2':
                              rowData[key] = rowData[key] / 2;
                              break;
                            case 'value + 100':
                              rowData[key] = rowData[key] + 100;
                              break;
                            case 'value - 50':
                              rowData[key] = rowData[key] - 50;
                              break;
                            case 'round(value)':
                              rowData[key] = Math.round(rowData[key]);
                              break;
                            case 'ceil(value)':
                              rowData[key] = Math.ceil(rowData[key]);
                              break;
                            case 'floor(value)':
                              rowData[key] = Math.floor(rowData[key]);
                              break;
                          }
                        }
                        break;
                      case 'categorize':
                        // 应用分类规则
                        if (rule.categories) {
                          const value = rowData[key];
                          for (const category of rule.categories) {
                            if (category.range && value >= category.range[0] && value <= category.range[1]) {
                              rowData[key] = category.label;
                              break;
                            } else if (category.value && value === category.value) {
                              rowData[key] = category.label;
                              break;
                            }
                          }
                        }
                        break;
                      case 'dateFormat':
                        // 应用日期格式化规�?                        if (rule.format) {
                          const date = new Date(rowData[key]);
                          switch (rule.format) {
                            case 'YYYY-MM-DD':
                              rowData[key] = date.toISOString().split('T')[0];
                              break;
                            case 'YYYY/MM/DD':
                              rowData[key] = date.toISOString().split('T')[0].replace(/-/g, '/');
                              break;
                            case 'MM-DD-YYYY':
                              const [year, month, day] = date.toISOString().split('T')[0].split('-');
                              rowData[key] = `${month}-${day}-${year}`;
                              break;
                          }
                        }
                        break;
                      case 'textTransform':
                        // 应用文本转换规则
                        if (rule.transform) {
                          const text = rowData[key];
                          switch (rule.transform) {
                            case 'uppercase':
                              rowData[key] = text.toUpperCase();
                              break;
                            case 'lowercase':
                              rowData[key] = text.toLowerCase();
                              break;
                            case 'capitalize':
                              rowData[key] = text.charAt(0).toUpperCase() + text.slice(1).toLowerCase();
                              break;
                          }
                        }
                        break;
                    }
                  }
                });
              }
              
              // 支持计算新列
              if (options.calculatedColumns) {
                Object.keys(options.calculatedColumns).forEach(newCol => {
                  const formula = options.calculatedColumns[newCol];
                  try {
                    // 简单的公式计算
                    if (formula === 'value * 2') {
                      rowData[newCol] = rowData.value * 2;
                    } else if (formula === 'value + 100') {
                      rowData[newCol] = rowData.value + 100;
                    } else if (formula === 'value * 0.8') {
                      rowData[newCol] = rowData.value * 0.8;
                    }
                  } catch (e) {
                    console.error('计算新列失败:', e);
                    rowData[newCol] = '';
                  }
                });
              }
              
              mergedData.push(rowData);
            });
          });
          
          console.log('合并后数据总量:', mergedData.length);
          
          // 支持数据过滤
          let filteredData = mergedData;
          if (options.filters) {
            filteredData = mergedData.filter(item => {
              for (const [column, condition] of Object.entries(options.filters)) {
                if (item.hasOwnProperty(column)) {
                  const value = item[column];
                  if (condition.type === 'greaterThan' && value <= condition.value) {
                    return false;
                  } else if (condition.type === 'lessThan' && value >= condition.value) {
                    return false;
                  } else if (condition.type === 'equalTo' && value !== condition.value) {
                    return false;
                  } else if (condition.type === 'contains' && !value.includes(condition.value)) {
                    return false;
                  }
                }
              }
              return true;
            });
            console.log('过滤后数据量:', filteredData.length);
          }
          
          // 支持数据排序
          if (options.sortBy) {
            filteredData.sort((a, b) => {
              const sortField = options.sortBy.field;
              const sortOrder = options.sortBy.order || 'asc';
              if (a[sortField] < b[sortField]) {
                return sortOrder === 'asc' ? -1 : 1;
              }
              if (a[sortField] > b[sortField]) {
                return sortOrder === 'asc' ? 1 : -1;
              }
              return 0;
            });
          }
          
          // 模拟写入Excel文件
          let excelContent = allColumnNames.join(',') + '\n';
          filteredData.forEach(item => {
            const row = allColumnNames.map(col => {
              // 根据列名获取对应的数�?              switch (col) {
                case 'ID':
                  return item.id;
                case '项目名称':
                  return item.name;
                case '数�?:
                  return item.value;
                case '类别':
                  return item.category;
                case '日期':
                  return item.date;
                case '来源文件':
                  return item.source;
                default:
                  // 支持自定义列
                  return item[col] || '';
              }
            });
            excelContent += row.join(',') + '\n';
          });
          
          console.log('Excel内容长度:', excelContent.length);
          
          // 创建下载链接
          const blob = new Blob([excelContent], { type: 'text/csv;charset=utf-8;' });
          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = filename.replace('.xlsx', '.csv');
          console.log('触发下载，文件名:', link.download);
          link.click();
          
          // 使用新的消息格式显示文件信息
          addMessage('ai', {
            filename: filename,
            path: newExcelPath,
            columns: allColumnNames,
            records: filteredData.length,
            options: options
          }, {
            type: 'file'
          });
          
          // 显示生成成功的详细信�?          let successMessage = `Excel文件生成成功！\n\n`;
          successMessage += `文件名称: ${filename}\n`;
          successMessage += `保存路径: ${newExcelPath}\n`;
          successMessage += `原始数据�? ${mergedData.length} 条记录\n`;
          successMessage += `过滤后数据量: ${filteredData.length} 条记录\n`;
          successMessage += `包含�? ${allColumnNames.join(', ')}\n`;
          
          if (options.transformRules) {
            successMessage += `\n应用了数据转换规则\n`;
          }
          
          if (options.filters) {
            successMessage += `\n应用了数据过滤条件\n`;
          }
          
          if (options.sortBy) {
            successMessage += `\n应用了数据排�? ${options.sortBy.field} ${options.sortBy.order || 'asc'}\n`;
          }
          
          if (options.calculatedColumns) {
            successMessage += `\n添加了计算列: ${Object.keys(options.calculatedColumns).join(', ')}\n`;
          }
          
          addMessage('ai', successMessage, { type: 'success' });
          
          console.log('Excel文件生成完成');
          resolve({ filename, path: newExcelPath, records: filteredData.length });
        } catch (error) {
          console.error('生成Excel文件异常:', error);
          addMessage('ai', `生成Excel文件失败: ${error.message}`, { type: 'error' });
          reject(error);

      });

    // 记忆系统 - 智能体的核心组件之一
    class MemorySystem {
      constructor() {
        this.shortTermMemory = []; // 短期记忆，存储最近的对话和事�?        this.longTermMemory = new Map(); // 长期记忆，存储重要的信息
        this.episodicMemory = []; // 情景记忆，存储特定场景的记忆
        this.semanticMemory = new Map(); // 语义记忆，存储事实和概念
        this.proceduralMemory = new Map(); // 程序记忆，存储如何执行任务的记忆
        this.maxShortTermMemorySize = 50; // 短期记忆最大容�?        this.initializeSemanticMemory();
        this.initializeProceduralMemory();
      }
      
      // 初始化语义记�?      initializeSemanticMemory() {
        this.semanticMemory.set('excel_file_format', 'Excel文件格式包括.xlsx�?xls');
        this.semanticMemory.set('data_analysis', '数据分析是指对数据进行统计、汇总和可视化的过程');
        this.semanticMemory.set('data_cleaning', '数据清洗是指处理数据中的空值、重复值和异常�?);
        this.semanticMemory.set('data_visualization', '数据可视化是指将数据转化为图表等视觉形式');
        this.semanticMemory.set('pivot_table', '数据透视表是一种交互式的表格，可以对数据进行多维度分析');
      }
      
      // 初始化程序记�?      initializeProceduralMemory() {
        this.proceduralMemory.set('read_excel', '读取Excel文件的步骤：1. 选择文件 2. 解析文件 3. 提取数据');
        this.proceduralMemory.set('analyze_data', '分析数据的步骤：1. 了解数据结构 2. 执行统计分析 3. 生成可视化结�?4. 提供洞察');
        this.proceduralMemory.set('generate_excel', '生成Excel文件的步骤：1. 准备数据 2. 设置格式 3. 写入文件 4. 保存到指定路�?);
      }
      
      // 添加短期记忆
      addShortTermMemory(content, type = 'general') {
        const memory = {
          id: `st_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`,
          content,
          type,
          timestamp: new Date(),
          priority: this.calculatePriority(content, type)
        };
        
        this.shortTermMemory.push(memory);
        
        // 保持短期记忆在容量限制内
        if (this.shortTermMemory.length > this.maxShortTermMemorySize) {
          this.shortTermMemory.sort((a, b) => b.priority - a.priority);
          this.shortTermMemory = this.shortTermMemory.slice(0, this.maxShortTermMemorySize);
        }
        
        return memory.id;
      }
      
      // 添加长期记忆
      addLongTermMemory(key, content, metadata = {}) {
        this.longTermMemory.set(key, {
          content,
          metadata,
          timestamp: new Date(),
          lastAccessed: new Date()
        });
      }
      
      // 添加情景记忆
      addEpisodicMemory(event, context, outcome) {
        const memory = {
          id: `ep_${Date.now()}`,
          event,
          context,
          outcome,
          timestamp: new Date(),
          emotionalValence: this.calculateEmotionalValence(outcome)
        };
        
        this.episodicMemory.push(memory);
        return memory.id;
      }
      
      // 添加语义记忆
      addSemanticMemory(key, content) {
        this.semanticMemory.set(key, content);
      }
      
      // 添加程序记忆
      addProceduralMemory(key, procedure) {
        this.proceduralMemory.set(key, procedure);
      }
      
      // 获取短期记忆
      getShortTermMemory(limit = 10) {
        return this.shortTermMemory
          .sort((a, b) => b.timestamp - a.timestamp)
          .slice(0, limit);
      }
      
      // 获取长期记忆
      getLongTermMemory(key) {
        const memory = this.longTermMemory.get(key);
        if (memory) {
          memory.lastAccessed = new Date();
        }
        return memory;
      }
      
      // 获取情景记忆
      getEpisodicMemory(eventType, limit = 5) {
        return this.episodicMemory
          .filter(memory => memory.event.includes(eventType))
          .sort((a, b) => b.timestamp - a.timestamp)
          .slice(0, limit);
      }
      
      // 获取语义记忆
      getSemanticMemory(key) {
        return this.semanticMemory.get(key);
      }
      
      // 获取程序记忆
      getProceduralMemory(key) {
        return this.proceduralMemory.get(key);
      }
      
      // 搜索记忆
      searchMemory(query, memoryTypes = ['shortTerm', 'longTerm', 'semantic']) {
        const results = [];
        
        if (memoryTypes.includes('shortTerm')) {
          this.shortTermMemory.forEach(memory => {
            if (memory.content.toLowerCase().includes(query.toLowerCase())) {
              results.push({ type: 'shortTerm', ...memory });
            }
          });
        }
        
        if (memoryTypes.includes('longTerm')) {
          this.longTermMemory.forEach((memory, key) => {
            if (key.toLowerCase().includes(query.toLowerCase()) || 
                memory.content.toLowerCase().includes(query.toLowerCase())) {
              results.push({ type: 'longTerm', key, ...memory });
            }
          });
        }
        
        if (memoryTypes.includes('semantic')) {
          this.semanticMemory.forEach((content, key) => {
            if (key.toLowerCase().includes(query.toLowerCase()) || 
                content.toLowerCase().includes(query.toLowerCase())) {
              results.push({ type: 'semantic', key, content });
            }
          });
        }
        
        return results.sort((a, b) => b.timestamp - a.timestamp);
      }
      
      // 计算记忆优先�?      calculatePriority(content, type) {
        let priority = 0.5;
        
        // 根据类型调整优先�?        if (type === 'error') priority = 0.9;
        if (type === 'success') priority = 0.7;
        if (type === 'question') priority = 0.8;
        
        // 根据内容长度和重要性调整优先级
        if (content.length > 100) priority += 0.1;
        if (content.includes('重要') || content.includes('紧�?)) priority += 0.2;
        
        return Math.min(priority, 1.0);
      }
      
      // 计算情绪 valence
      calculateEmotionalValence(outcome) {
        const positiveWords = ['成功', '完成', '�?, '优秀', '满意', '正确'];
        const negativeWords = ['失败', '错误', '问题', '异常', '不满�?, '错误'];
        
        let valence = 0;
        
        positiveWords.forEach(word => {
          if (outcome.includes(word)) valence += 1;
        });
        
        negativeWords.forEach(word => {
          if (outcome.includes(word)) valence -= 1;
        });
        
        return valence;
      }
      
      // 遗忘机制
      forget(force = false) {
        // 遗忘低优先级的短期记�?        if (force || this.shortTermMemory.length > this.maxShortTermMemorySize * 0.8) {
          this.shortTermMemory.sort((a, b) => a.priority - b.priority);
          this.shortTermMemory = this.shortTermMemory.slice(Math.floor(this.shortTermMemory.length * 0.3));
        }
        
        // 遗忘长期未访问的长期记忆
        const now = new Date();
        const expiredKeys = [];
        
        this.longTermMemory.forEach((memory, key) => {
          const daysSinceAccess = (now - memory.lastAccessed) / (1000 * 60 * 60 * 24);
          if (daysSinceAccess > 30) {
            expiredKeys.push(key);
          }
        });
        
        expiredKeys.forEach(key => this.longTermMemory.delete(key));
      }
      
      // 记忆增强
      strengthenMemory(memoryId) {
        // 增强短期记忆
        const shortTermIndex = this.shortTermMemory.findIndex(m => m.id === memoryId);
        if (shortTermIndex !== -1) {
          this.shortTermMemory[shortTermIndex].priority = Math.min(this.shortTermMemory[shortTermIndex].priority + 0.2, 1.0);
        }
      }
    }

          for (const step of plan.steps) {
            if (step.required || options.includeOptionalSteps) {
              step.status = 'in_progress';
              step.startTime = new Date();
              
              try {
                // 执行步骤
                const stepResult = await this.executeStep(step, plan, toolManager, options);
                step.results = stepResult;
                step.status = 'completed';
                step.endTime = new Date();
                step.actualTime = step.endTime - step.startTime;
                
                // 更新计划进度
                plan.progress = this.calculatePlanProgress(plan);

                  `步骤 ${step.name} 执行成功: ${JSON.stringify(stepResult)}`,
                  'success'
                );
              } catch (error) {
                step.error = error.message;
                step.status = 'failed';
                step.endTime = new Date();
                step.actualTime = step.endTime - step.startTime;
                
                // 记录执行失败

                // 添加到记忆系�?                this.memorySystem.addShortTermMemory(
                  `步骤 ${step.name} 执行失败: ${error.message}`,
                  'error'
                );

                if (step.required) {

          plan.endTime = new Date();

      // 处理用户反馈
      processFeedback(feedback, context = {}) {
        const feedbackId = `feedback_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
        
        // 分析反馈
        const analysis = this.analyzeFeedback(feedback);
        
        // 创建反馈记录
        const feedbackRecord = {
          id: feedbackId,
          feedback,
          context,
          analysis,
          timestamp: new Date(),
          priority: analysis.priority,
          actions: this.generateFeedbackActions(analysis)
        };
        
        // 存储反馈
        this.feedbackHistory.push(feedbackRecord);
        
        // 限制反馈历史大小
        if (this.feedbackHistory.length > 50) {
          this.feedbackHistory = this.feedbackHistory.slice(-50);
        }
        
        // 基于反馈进行反�?        this.reflectOnExperience(`用户反馈: ${feedback}`, {
          ...context,
          feedbackAnalysis: analysis
        });
        
        // 添加到记忆系�?        this.memorySystem.addShortTermMemory(
          `用户反馈: ${feedback}`,
          analysis.sentiment === 'positive' ? 'success' : 'error'
        );
        
        return feedbackRecord;
      }
      
      // 分析反馈
      analyzeFeedback(feedback) {
        const feedbackLower = feedback.toLowerCase();
        
        // 情感分析
        const sentiment = this.analyzeSentiment(feedback);
        
        // 主题识别
        const topics = this.identifyFeedbackTopics(feedback);
        
        // 优先级评�?        const priority = this.assessFeedbackPriority(feedback, sentiment);
        
        return {
          sentiment,
          topics,
          priority,
          urgency: this.assessUrgency(feedback),
          actionable: this.isActionable(feedback)
        };
      }
      
      // 分析情感
      analyzeSentiment(feedback) {
        const positiveWords = ['�?, '优秀', '满意', '喜欢', '�?, '�?, '�?, '准确'];
        const negativeWords = ['�?, '�?, '错误', '不满�?, '不喜�?, '失败', '问题'];
        
        let positiveCount = 0;
        let negativeCount = 0;
        
        positiveWords.forEach(word => {
          if (feedback.includes(word)) positiveCount++;
        });
        
        negativeWords.forEach(word => {
          if (feedback.includes(word)) negativeCount++;
        });
        
        if (positiveCount > negativeCount) return 'positive';
        if (negativeCount > positiveCount) return 'negative';
        return 'neutral';
      }
      
      // 识别反馈主题
      identifyFeedbackTopics(feedback) {
        const topics = [];
        
        if (feedback.includes('Excel')) topics.push('excel');
        if (feedback.includes('分析')) topics.push('analysis');
        if (feedback.includes('速度')) topics.push('performance');
        if (feedback.includes('对话')) topics.push('dialogue');
        if (feedback.includes('错误')) topics.push('error');
        if (feedback.includes('界面')) topics.push('ui');
        
        return topics.length > 0 ? topics : ['general'];
      }
      
      // 评估反馈优先�?      assessFeedbackPriority(feedback, sentiment) {
        if (sentiment === 'negative' && (feedback.includes('错误') || feedback.includes('失败'))) {
          return 1; // 高优先级
        } else if (sentiment === 'negative') {
          return 2; // 中优先级
        } else if (sentiment === 'positive') {
          return 3; // 低优先级
        } else {
          return 2; // 中优先级
        }
      }
      
      // 评估紧急�?      assessUrgency(feedback) {
        return feedback.includes('紧�?) || feedback.includes('立刻') || feedback.includes('马上');
      }
      
      // 判断是否可操�?      isActionable(feedback) {
        const actionableWords = ['希望', '建议', '需�?, '应该', '可以', '更好', '改进'];
        return actionableWords.some(word => feedback.includes(word));
      }
      
      // 生成反馈行动
      generateFeedbackActions(analysis) {
        const actions = [];
        
        if (analysis.sentiment === 'negative') {
          actions.push('分析问题原因');
          actions.push('制定改进计划');
          actions.push('实施改进措施');
        } else if (analysis.sentiment === 'positive') {
          actions.push('总结成功经验');
          actions.push('强化优势领域');
        }
        
        if (analysis.topics.includes('performance')) {
          actions.push('优化系统性能');
        }
        
        if (analysis.topics.includes('dialogue')) {
          actions.push('改进对话交互');
        }
        
        return actions;
      }
      
      // 计算置信�?      calculateConfidence(analysis) {
        let confidence = 0.5;
        
        // 基于分析结果计算置信�?        if (analysis.success) confidence += 0.2;
        if (analysis.patterns.length > 0) confidence += 0.1;
        if (analysis.contextAnalysis.fileCount) confidence += 0.1;
        
        return Math.min(confidence, 1.0);
      }
      
      // 获取反思记�?      getReflections(limit = 10) {
        return this.reflections.slice(-limit);
      }
      
      // 获取改进领域
      getImprovementAreas() {
        return Array.from(this.improvementAreas.values())
          .sort((a, b) => a.priority - b.priority);
      }
      
      // 获取学习目标
      getLearningGoals() {
        return Array.from(this.learningGoals);
      }

    // 任务管理�?    class TaskManager {
      constructor() {
        this.tasks = new Map();
        this.activeTasks = new Set();
      }
      
      createTask(id, description, steps) {
        this.tasks.set(id, {
          id: id,
          description: description,
          steps: steps,
          status: 'pending',
          progress: 0,
          result: null
        });
        return this.tasks.get(id);
      }
      
      async executeTask(taskId) {
        const task = this.tasks.get(taskId);
        if (!task) {
          throw new Error(`Task ${taskId} not found`);
        }
        
        task.status = 'in_progress';
        this.activeTasks.add(taskId);
        
        try {
          const results = [];
          for (let i = 0; i < task.steps.length; i++) {
            const step = task.steps[i];
            try {
              // 执行步骤
              const result = await step.execute();
              results.push({
                step: step.description,
                result: result
              });
              task.progress = (i + 1) / task.steps.length;
            } catch (error) {
              results.push({
                step: step.description,
                error: error.message
              });
            }
          }
          
          task.status = 'completed';
          task.result = results;
          return results;
        } finally {
          this.activeTasks.delete(taskId);
        }
      }
      
      getTask(taskId) {
        return this.tasks.get(taskId);
      }
      
      getActiveTasks() {
        return Array.from(this.activeTasks).map(id => this.tasks.get(id));
      }
    }

      static calculateConfidence(message, keyword) {
        // 改进的置信度计算
        const keywordLength = keyword.length;
        const messageLength = message.length;
        const ratio = keywordLength / messageLength;
        
        // 关键词在消息中的位置权重
        const position = message.toLowerCase().indexOf(keyword);
        const positionWeight = position === 0 ? 1.5 : (position < messageLength * 0.3 ? 1.2 : 1.0);
        
        // 关键词完整性权�?        const isExactMatch = message.toLowerCase() === keyword;
        const exactMatchWeight = isExactMatch ? 2.0 : 1.0;
        
        // 计算最终置信度
        let confidence = ratio * 2 * positionWeight * exactMatchWeight;
        return Math.min(confidence, 1.0);
      }

      generateFollowUpQuestions(intent, context, response) {
        // 首先获取意图对应的后续问�?        let questions = IntentRecognizer.getFollowUpQuestions(intent.type) || [];
        
        // 如果响应中已经包含后续问题，使用响应中的问题
        if (response && response.followUpQuestions) {
          questions = response.followUpQuestions;
        }
        
        // 根据上下文调整后续问�?        if (context.contextAnalysis) {
          if (context.contextAnalysis.messageType === 'question') {
            // 如果用户问了问题，提供更具体的后续问�?            questions = questions.map(q => `您是�?{q}`);
          } else if (context.contextAnalysis.messageType === 'command') {
            // 如果用户下了命令，提供执行相关的后续问题
            questions = questions.map(q => `执行过程中，${q}`);
          }
        }
        
        // 针对Excel相关意图添加特定的后续问�?        if (intent.type === 'data_export' || intent.type === 'generate_excel') {
          questions.push('您希望文件保存为什么名称？');
          questions.push('您需要在文件中包含哪些列�?);
          questions.push('您希望对数据进行什么格式的处理�?);
        }
        
        return questions;
      }
      
      updateUserPreferences(message, intent) {
        // 简单的用户偏好学习
        const preferenceKey = `intent_${intent.type}`;
        const currentCount = this.userPreferences.get(preferenceKey) || 0;
        this.userPreferences.set(preferenceKey, currentCount + 1);
        
        // 保持用户偏好的数量在合理范围
        if (this.userPreferences.size > 100) {
          // 删除使用频率最低的偏好
          const leastFrequent = Array.from(this.userPreferences.entries())
            .sort((a, b) => a[1] - b[1])[0][0];
          this.userPreferences.delete(leastFrequent);
        }
      }
      
      learnFromInteraction(message, intent, results, reflection) {
        // 从交互中学习
        const success = results && results.every(r => r.status === 'success');
        
        // 添加情景记忆
        this.memorySystem.addEpisodicMemory(
          `执行${intent.description}任务`,
          {
            message: message,
            intent: intent.type,
            success: success,
            timestamp: new Date()
          },
          success ? '任务执行成功' : '任务执行失败'
        );
        
        // 添加语义记忆
        if (success) {
          this.memorySystem.addSemanticMemory(
            `success_${intent.type}`,
            `成功执行${intent.description}任务的方法`
          );
        }
        
        // 添加程序记忆
        this.memorySystem.addProceduralMemory(
          `execute_${intent.type}`,
          `执行${intent.description}任务的步骤`,
          {
            intent: intent.type,
            success: success
          }
        );
      }
      
      getAvailableTools() {
        return this.toolManager.listTools();
      }
      
      getToolsForIntent(intent) {
        return this.toolManager.getToolsForIntent(intent);
      }
      
      getActiveTasks() {
        return this.taskManager.getActiveTasks();
      }
      
      getMemory() {
        return this.memorySystem.getShortTermMemory(20);
      }
      
      async sendToDingTalk(message, options = {}) {
        return await this.dingTalk.send(message, options);
      }
      
      async receiveFromDingTalk() {
        return await this.dingTalk.receive();
      }
      
      getConversationHistory() {
        return this.conversationHistory;
      }
      
      getUserPreferences() {
        return Array.from(this.userPreferences.entries())
          .sort((a, b) => b[1] - a[1]);
      }
      
      clearContext() {
        this.context.clearContext();
        this.conversationHistory = [];
        this.currentTaskId = null;
        this.conversationId = `conv_${Date.now()}`;
        this.messageCount = 0;
      }
      
      getSystemStatus() {
        return {
          memorySize: this.memorySystem.shortTermMemory.length,
          conversationCount: this.conversationHistory.length,
          userPreferencesCount: this.userPreferences.size,
          availableTools: this.toolManager.listTools().length
        };
      }
    }

    // 为报告生成意图添加后续问�?    IntentRecognizer.getFollowUpQuestions = (function(original) {
      return function(intent) {
        if (intent === 'generate_report') {
          return [
            '您希望分析多长时间范围内的数据？',
            '您关注哪些关键业务指标？',
            '您需要在报告中包含哪些类型的图表�?
          ];
        }
        return original.call(IntentRecognizer, intent);
      };
    })(IntentRecognizer.getFollowUpQuestions);

    function addMessage(type, content, options = {}) {
      const messagesDiv = document.getElementById('chat-messages');
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${type}-message`;
      
      // 添加消息出现的动画效�?      messageDiv.style.opacity = '0';
      messageDiv.style.transform = 'translateY(10px)';
      messageDiv.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
      messageDiv.style.animation = 'fadeIn 0.3s ease forwards';
      
      // 根据选项添加不同类型的内�?      if (options.type === 'loading') {
        messageDiv.innerHTML = `

        messageDiv.innerHTML = `
          <div style="background: rgba(78, 205, 196, 0.05); border-left: 4px solid #4ecdc4; border-radius: 8px; padding: 12px;">
            <div style="display: flex; align-items: flex-start; gap: 10px;">
              <span style="font-size: 18px; margin-top: -2px;">�?/span>
              <div>
                <div style="font-weight: 600; color: #4ecdc4; margin-bottom: 4px;">操作成功</div>
                <div style="font-size: 14px; color: #555; line-height: 1.4;">${content}</div>
              </div>
            </div>
          </div>
        `;

        messageDiv.innerHTML = `
          <div style="background: rgba(69, 183, 209, 0.05); border-left: 4px solid #45b7d1; border-radius: 8px; padding: 12px;">
            <div style="display: flex; align-items: flex-start; gap: 10px;">
              <span style="font-size: 18px; margin-top: -2px;">ℹ️</span>
              <div>
                <div style="font-weight: 600; color: #45b7d1; margin-bottom: 4px;">信息提示</div>
                <div style="font-size: 14px; color: #555; line-height: 1.4;">${content}</div>
              </div>
            </div>
          </div>
        `;
      } else if (options.type === 'file') {
        messageDiv.innerHTML = `
          <div style="background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%); border-radius: 10px; padding: 16px; border: 1px solid #e0e0e0; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">
            <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 12px;">
              <span style="font-size: 20px;">📁</span>
              <div style="font-weight: 600; color: #667eea; font-size: 16px;">文件生成</div>
            </div>
            <div style="margin-bottom: 8px; font-size: 14px;">
              <span style="font-weight: 500; color: #555;">文件�?</span> 
              <span style="color: #333;">${content.filename}</span>
            </div>
            <div style="margin-bottom: 8px; font-size: 14px;">
              <span style="font-weight: 500; color: #555;">保存路径:</span> 
              <span style="color: #333; font-family: monospace;">${content.path}</span>
            </div>
            ${content.records ? `<div style="margin-bottom: 8px; font-size: 14px;">
              <span style="font-weight: 500; color: #555;">记录�?</span> 
              <span style="color: #333;">${content.records} �?/span>
            </div>` : ''}
            ${content.columns ? `<div style="margin-bottom: 12px; font-size: 14px;">
              <span style="font-weight: 500; color: #555;">包含�?</span> 
              <span style="color: #333;">${content.columns.join(', ')}</span>
            </div>` : ''}
            <button onclick="openFile('${content.path}')" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 6px; padding: 8px 16px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.3s ease;">
              打开文件
            </button>
          </div>
        `;
      } else if (options.type === 'chart') {
        messageDiv.innerHTML = `
          <div style="background: white; border-radius: 10px; padding: 16px; border: 1px solid #e0e0e0; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">
            <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 16px;">
              <span style="font-size: 20px;">📊</span>
              <div style="font-weight: 600; color: #667eea; font-size: 16px;">数据可视�?/div>
            </div>
            <div id="chart-${Date.now()}" style="width: 100%; height: 350px; border-radius: 8px; overflow: hidden;"></div>
          </div>
        `;
      } else if (options.type === 'form') {
        messageDiv.innerHTML = `
          <div style="background: white; border-radius: 10px; padding: 16px; border: 1px solid #e0e0e0; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">
            <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 16px;">
              <span style="font-size: 20px;">📋</span>
              <div style="font-weight: 600; color: #667eea; font-size: 16px;">${content.title || '操作选项'}</div>
            </div>
            <div style="font-size: 14px; color: #555;">
              ${content.form}
            </div>
          </div>
        `;
      } else if (options.type === 'analysis') {
        messageDiv.innerHTML = `
          <div style="background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%); border-radius: 10px; padding: 16px; border: 1px solid #e0e0e0; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">
            <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 12px;">
              <span style="font-size: 20px;">📈</span>
              <div style="font-weight: 600; color: #667eea; font-size: 16px;">分析结果</div>
            </div>
            <div style="font-size: 14px; color: #333; line-height: 1.6;">
              ${content}
            </div>
          </div>
        `;
      } else {
        // 处理普通文本消息和对象消息
        if (typeof content === 'object') {
          if (content.filename) {
            // 文件消息
            messageDiv.innerHTML = `
              <div style="background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%); border-radius: 10px; padding: 16px; border: 1px solid #e0e0e0; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">
                <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 12px;">
                  <span style="font-size: 20px;">📁</span>
                  <div style="font-weight: 600; color: #667eea; font-size: 16px;">文件生成</div>
                </div>
                <div style="margin-bottom: 8px; font-size: 14px;">
                  <span style="font-weight: 500; color: #555;">文件�?</span> 
                  <span style="color: #333;">${content.filename}</span>
                </div>
                <div style="margin-bottom: 8px; font-size: 14px;">
                  <span style="font-weight: 500; color: #555;">保存路径:</span> 
                  <span style="color: #333; font-family: monospace;">${content.path}</span>
                </div>
                ${content.columns ? `<div style="margin-bottom: 8px; font-size: 14px;">
                  <span style="font-weight: 500; color: #555;">包含�?</span> 
                  <span style="color: #333;">${content.columns.join(', ')}</span>
                </div>` : ''}
                ${content.records ? `<div style="margin-bottom: 12px; font-size: 14px;">
                  <span style="font-weight: 500; color: #555;">记录�?</span> 
                  <span style="color: #333;">${content.records} �?/span>
                </div>` : ''}
                <button onclick="openFile('${content.path}')" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 6px; padding: 8px 16px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.3s ease;">
                  打开文件
                </button>
              </div>
            `;
          } else {
            // 其他对象消息
            messageDiv.innerHTML = `
              <div style="background: #f8f9fa; border-radius: 8px; padding: 12px; border: 1px solid #e0e0e0;">
                <div style="font-size: 14px; color: #555;">${JSON.stringify(content, null, 2)}</div>
              </div>

          }
        } else {
          // 支持Markdown格式的文本消�?          const formattedContent = content.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                                         .replace(/\n/g, '<br>');

            if (chartContainer) {

            }
          }
        }, 500);
      }
      
      // 添加消息到对话上下文
      if (type === 'ai') {
        conversationContext.addMessage(content, 'ai');
      }
      
      return messageDiv;
    }

    function initChart(chartContainer, chartData, columnNamesList) {
      const chart = echarts.init(chartContainer);
      
      // 准备数据，基于实际列�?      const categories = chartData.map((_, index) => {
        const columnNames = columnNamesList[index];
        return columnNames ? columnNames[1] : `文件${index + 1}`;
      });
      
      const series = chartData.map((data, index) => {
        // 计算每个文件的统计数�?        const values = data.map(item => item.value);
        const maxValue = Math.max(...values);
        const minValue = Math.min(...values);
        const avgValue = Math.round(values.reduce((sum, val) => sum + val, 0) / values.length);
        
        return {
          name: categories[index],
          type: 'bar',
          data: [maxValue, minValue, avgValue]
        };
      });
      
      const option = {
        title: {
          text: '多文件数据分析对�?,
          left: 'center',
          textStyle: {
            fontSize: 16,
            fontWeight: 'bold',
            color: '#1a1a2e'
          }
        },
        tooltip: {
          trigger: 'axis',
          backgroundColor: 'rgba(255,255,255,0.9)',
          borderColor: '#667eea',
          borderWidth: 1,
          textStyle: {
            color: '#1a1a2e'
          }
        },
        legend: {
          data: categories,
          bottom: 10,
          textStyle: {
            color: '#555'
          }
        },
        xAxis: {
          type: 'category',
          data: ['最大�?, '最小�?, '平均�?],
          axisLine: {
            lineStyle: {
              color: '#e0e0e0'
            }
          },
          axisLabel: {
            color: '#555'
          }
        },
        yAxis: {
          type: 'value',
          axisLine: {
            lineStyle: {
              color: '#e0e0e0'
            }
          },
          axisLabel: {
            color: '#555'
          }
        },
        series: series.map((seriesItem, index) => {
          // 生成不同的渐变色
          const colors = [
            ['#667eea', '#764ba2'],
            ['#f093fb', '#f5576c'],
            ['#4facfe', '#00f2fe'],
            ['#a8edea', '#fed6e3'],
            ['#a18cd1', '#fbc2eb']
          ];
          const colorIndex = index % colors.length;
          
          return {
            name: seriesItem.name,
            type: 'bar',
            data: seriesItem.data,
            itemStyle: {
              color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                { offset: 0, color: colors[colorIndex][0] },
                { offset: 1, color: colors[colorIndex][1] }
              ]),
              borderRadius: [4, 4, 0, 0]
            }
          };
        })
      };
      
      chart.setOption(option);
      
      // 响应窗口大小变化
      window.addEventListener('resize', () => {
        chart.resize();
      });
    }

    // 响应回车发送消�?    document.getElementById('chat-input').addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // 窗口大小改变时调整布局
    window.addEventListener('resize', function() {
      // 可以在这里添加布局调整逻辑
    });

    // 初始化OfficeBot实例
    const officeBot = new OfficeBot();
  </script>
