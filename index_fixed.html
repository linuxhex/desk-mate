<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>桌面Excel分析助手</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
      min-height: 100vh;
      overflow: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 20px;
      max-width: 1800px;
      margin: 0 auto;
    }

    .chat-panel {
      flex: 1;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 800px;
    }

    .main-content {
      display: flex;
      flex: 1;
      gap: 20px;
      margin-bottom: 20px;
      min-height: 0;
      z-index: 5;
    }

    .left-panel {
      flex: 1;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 400px;
    }

    .chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      background: #fafafa;
    }

    .message {
      margin-bottom: 15px;
      padding: 12px 16px;
      border-radius: 12px;
      animation: fadeIn 0.3s ease;
      max-width: 80%;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .user-message {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      align-self: flex-end;
      margin-left: auto;
      box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
    }

    .ai-message {
      background: white;
      color: #1a1a2e;
      align-self: flex-start;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      border: 1px solid #e0e0e0;
    }

    .chat-input-area {
      padding: 20px;
      border-top: 1px solid #e0e0e0;
      background: white;
      position: relative;
    }

    .input-container {
      position: relative;
      margin-bottom: 10px;
    }

    .file-upload-btn {
      margin-bottom: 10px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .file-upload-btn:hover {
      background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .upload-icon {
      font-size: 16px;
    }

    .upload-text {
      font-size: 14px;
    }

    .chat-input {
      width: 100%;
      min-height: 120px;
      padding: 15px 260px 15px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      resize: vertical;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
      background: white;
    }

    .chat-input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
    }

    .send-btn {
      position: absolute;
      bottom: 10px;
      right: 10px;
      z-index: 15;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 24px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
    }

    .send-btn:hover {
      background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .send-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .file-list {
      margin: 10px 0 20px 0;
      padding: 10px;
      background: #f8f9fa;
      border-radius: 8px;
      border: 1px solid #e0e0e0;
      max-height: 120px;
      overflow-y: auto;
    }

    .file-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
      margin-bottom: 6px;
      background: white;
      border-radius: 4px;
      border: 1px solid #e0e0e0;
      font-size: 12px;
    }

    .file-item:hover {
      background: #f0f4ff;
      border-color: #667eea;
    }

    .file-name {
      flex: 1;
      color: #333;
      font-weight: 500;
    }

    .remove-file {
      background: #ff6b6b;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 2px 8px;
      cursor: pointer;
      font-size: 10px;
      font-weight: 600;
      transition: background 0.3s ease;
    }

    .remove-file:hover {
      background: #ff5252;
    }

    .right-panel {
      flex: 1;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 400px;
    }

    .result-header {
      padding: 20px;
      border-bottom: 1px solid #e0e0e0;
      background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
    }

    .result-header h2 {
      font-size: 20px;
      font-weight: 600;
      color: #1a1a2e;
    }

    .result-content {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      background: #fafafa;
    }

    .chart-container {
      width: 100%;
      height: 400px;
      margin-bottom: 20px;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      background: white;
    }

    .analysis-result {
      background: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      border: 1px solid #e0e0e0;
    }

    .analysis-result h3 {
      color: #1a1a2e;
      margin-bottom: 15px;
      font-size: 16px;
      font-weight: 600;
    }

    .analysis-result p {
      color: #555;
      line-height: 1.6;
      margin-bottom: 10px;
    }

    .hidden {
      display: none;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
    }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #667eea;
      font-size: 14px;
      font-weight: 500;
    }

    .loading::after {
      content: '';
      width: 16px;
      height: 16px;
      margin-left: 10px;
      border: 2px solid #667eea;
      border-top: 2px solid transparent;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="main-content">
      <!-- 只保留对话框和输入框 -->
      <div class="chat-panel">
        <div class="chat-messages" id="chat-messages">
          <div class="message ai-message">
            你好！请上传Excel文件并告诉我你想要分析的内容。
          </div>
        </div>
        <div class="chat-input-area">
          <div class="file-list" id="file-list">
            <div class="file-info">未选择文件</div>
          </div>
          <div class="input-container">
            <label class="file-upload-btn" for="file-input">
              <input type="file" id="file-input" accept=".xlsx,.xls,.csv" multiple style="display: none;" onchange="handleFileSelect(event)">
              <span class="upload-icon">📁</span>
              <span class="upload-text">上传Excel</span>
            </label>
            <textarea class="chat-input" id="chat-input" placeholder="输入你的分析需求..."></textarea>
            <button class="send-btn" id="send-btn" onclick="sendMessage()">发送</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Excel服务，使用xlsx库处理文件
    class ExcelService {
      static readExcelData(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = function(e) {
            try {
              // 模拟解析Excel数据，实际应用中会使用xlsx库
              const data = new Uint8Array(e.target.result);
              
              // 模拟解析结果，包含实际的列名
              const mockData = Array.from({ length: 10 }, (_, i) => ({
                id: i + 1,
                name: `项目${i + 1}`,
                value: Math.floor(Math.random() * 1000) + 100,
                category: ['A类', 'B类', 'C类'][Math.floor(Math.random() * 3)],
                date: new Date(Date.now() - Math.random() * 10000000000).toISOString().split('T')[0]
              }));
              
              // 模拟列名
              const columnNames = ['ID', '项目名称', '数值', '类别', '日期'];
              
              resolve({
                success: true,
                data: mockData,
                columnNames: columnNames
              });
            } catch (error) {
              resolve({
                success: false,
                error: error.message
              });
            }
          };
          reader.onerror = function(error) {
            resolve({
              success: false,
              error: error.message
            });
          };
          reader.readAsArrayBuffer(file);
        });
      }
    }

    class MockAIService {
      static async analyzeExcel(data, query) {
        try {
          // 模拟AI分析
          await new Promise(resolve => setTimeout(resolve, 1500));
          return {
            success: true,
            content: `我已经分析了你的Excel数据，包含 ${data.length} 条记录。\n\n**数据概览**：\n- 最大值：${Math.max(...data.map(item => item.value))}\n- 最小值：${Math.min(...data.map(item => item.value))}\n- 平均值：${Math.round(data.reduce((sum, item) => sum + item.value, 0) / data.length)}\n\n**分析结果**：\n数据呈现正态分布，建议重点关注值较高的记录。\n\n**建议**：\n可以进一步分析数据的趋势和相关性，以获得更深入的洞察。`
          };
        } catch (error) {
          return {
            success: false,
            error: error.message
          };
        }
      }

      static async analyzeMultipleExcel(dataList, fileList, columnNamesList, query) {
        try {
          // 模拟AI分析
          await new Promise(resolve => setTimeout(resolve, 1500));
          
          // 计算所有文件的数据总量
          const totalRecords = dataList.reduce((sum, data) => sum + data.length, 0);
          
          // 计算每个文件的统计信息，基于实际列名
          const fileStats = fileList.map((file, index) => {
            const data = dataList[index];
            const columnNames = columnNamesList[index];
            
            // 基于数值列计算统计信息
            const values = data.map(item => item.value);
            const maxValue = Math.max(...values);
            const minValue = Math.min(...values);
            const avgValue = Math.round(values.reduce((sum, val) => sum + val, 0) / values.length);
            
            // 统计类别分布
            const categoryCount = {};
            data.forEach(item => {
              categoryCount[item.category] = (categoryCount[item.category] || 0) + 1;
            });
            
            return {
              name: file.name,
              records: data.length,
              columnNames: columnNames,
              max: maxValue,
              min: minValue,
              avg: avgValue,
              categoryCount: categoryCount
            };
          });
          
          let content = `我已经分析了你的 ${dataList.length} 个Excel文件，总共包含 ${totalRecords} 条记录。\n\n`;
          
          // 添加每个文件的统计信息，基于实际列名
          content += '**各文件统计信息**：\n';
          fileStats.forEach((stat, index) => {
            content += `${index + 1}. ${stat.name}\n`;
            content += `- 记录数：${stat.records}\n`;
            content += `- 数据列：${stat.columnNames.join(', ')}\n`;
            content += `- ${stat.columnNames[2]}（数值）统计：最大值${stat.max}，最小值${stat.min}，平均值${stat.avg}\n`;
            content += `- ${stat.columnNames[3]}（类别）分布：${Object.entries(stat.categoryCount).map(([k, v]) => `${k}:${v}个`).join(', ')}\n\n`;
          });
          
          // 添加联合分析结果
          content += '**联合分析结果**：\n';
          content += `- 数据总量：${totalRecords} 条\n`;
          content += `- 文件数量：${dataList.length} 个\n`;
          content += `- 平均每个文件记录数：${Math.round(totalRecords / dataList.length)}\n\n`;
          
          content += '**分析结果**：\n';
          content += '数据分布较为均匀，各文件数据量差异不大。\n';
          content += '建议重点关注值较高的记录，并分析各文件之间的相关性。\n\n';
          
          content += '**建议**：\n';
          content += '1. 可以进一步分析各文件之间的关联关系\n';
          content += '2. 考虑将多个文件的数据合并进行更全面的分析\n';
          content += '3. 可以设置阈值，筛选出重要的数据记录\n';
          
          return {
            success: true,
            content: content,
            fileStats: fileStats
          };
        } catch (error) {
          return {
            success: false,
            error: error.message
          };
        }
      }
    }

    let selectedFiles = [];
    let excelDataList = [];
    let columnNamesList = [];
    let chart = null;

    function openFileDialog() {
      const fileInput = document.getElementById('file-input');
      // 重置input的值，确保每次点击都能触发onchange事件，即使选择相同的文件
      fileInput.value = '';
      fileInput.click();
    }

    function handleFileSelect(event) {
      console.log('handleFileSelect函数被调用');
      try {
        const files = event.target.files;
        console.log('获取到文件:', files);
        if (files.length > 0) {
          addMessage('ai', '读取文件中...');
          
          // 模拟读取文件
          setTimeout(async () => {
            try {
              for (let i = 0; i < files.length; i++) {
                const file = files[i];
                console.log('处理文件:', file.name);
                const result = await ExcelService.readExcelData(file);
                console.log('读取文件结果:', result);
                
                if (result.success) {
                  selectedFiles.push({
                    name: file.name,
                    data: result.data
                  });
                  excelDataList.push(result.data);
                  columnNamesList.push(result.columnNames);
                }
              }
              
              updateFileList();
              addMessage('ai', `文件已上传并读取成功，共 ${selectedFiles.length} 个文件。现在可以输入你的分析需求了。`);
            } catch (error) {
              console.error('处理文件时出错:', error);
              addMessage('ai', `处理文件时出错: ${error.message}`);
            }
          }, 1000);
        }
      } catch (error) {
        console.error('handleFileSelect函数出错:', error);
        addMessage('ai', `文件选择出错: ${error.message}`);
      }
    }

    function updateFileList() {
      const fileListDiv = document.getElementById('file-list');
      
      if (selectedFiles.length === 0) {
        fileListDiv.innerHTML = '<div class="file-info">未选择文件</div>';
        return;
      }
      
      let html = '';
      selectedFiles.forEach((file, index) => {
        html += `
          <div class="file-item">
            <span class="file-name">${file.name}</span>
            <button class="remove-file" onclick="removeFile(${index})">删除</button>
          </div>
        `;
      });
      
      fileListDiv.innerHTML = html;
    }

    function removeFile(index) {
      selectedFiles.splice(index, 1);
      excelDataList.splice(index, 1);
      columnNamesList.splice(index, 1);
      updateFileList();
      addMessage('ai', `文件已删除，当前剩余 ${selectedFiles.length} 个文件。`);
    }

    function clearAllFiles() {
      selectedFiles = [];
      excelDataList = [];
      columnNamesList = [];
      updateFileList();
      addMessage('ai', '所有文件已清空。');
    }

    function generateNewExcel(fileStats, options = {}) {
      return new Promise((resolve, reject) => {
        try {
          console.log('开始生成Excel文件，文件统计:', fileStats, '选项:', options);
          
          // 模拟生成Excel文件，实际应用中会使用xlsx库
          const timestamp = new Date().getTime();
          const filename = options.filename || `分析结果_${timestamp}.xlsx`;
          const newExcelPath = `C:/Users/${window.navigator.userAgent.split('Windows NT')[1] ? 'User' : '王玉婷'}/Desktop/${filename}`;
          
          console.log('生成文件路径:', newExcelPath);
          
          // 合并所有文件的数据，保持列名一致
          const mergedData = [];
          let allColumnNames = options.columns || ['ID', '项目名称', '数值', '类别', '日期', '来源文件'];
          
          // 如果用户指定了自定义列名，则使用用户指定的列名
          if (options.customColumns) {
            allColumnNames = options.customColumns;
          }
          
          // 支持列映射功能
          const columnMapping = options.columnMapping || {};
          
          fileStats.forEach((stat, fileIndex) => {
            const data = excelDataList[fileIndex];
            console.log(`处理文件 ${fileIndex}:`, stat.name, '数据量:', data.length);
            data.forEach(item => {
              const rowData = {
                id: item.id,
                name: item.name,
                value: item.value,
                category: item.category,
                date: item.date,
                source: stat.name
              };
              
              // 应用列映射
              Object.keys(columnMapping).forEach(sourceCol => {
                const targetCol = columnMapping[sourceCol];
                if (rowData.hasOwnProperty(sourceCol)) {
                  rowData[targetCol] = rowData[sourceCol];
                }
              });
              
              // 如果用户指定了数据转换规则，则应用转换
              if (options.transformRules) {
                Object.keys(options.transformRules).forEach(key => {
                  if (rowData.hasOwnProperty(key)) {
                    const rule = options.transformRules[key];
                    switch (rule.type) {
                      case 'format':
                        // 应用格式化规则
                        if (rule.pattern) {
                          rowData[key] = rule.pattern.replace('{value}', rowData[key]);
                        }
                        break;
                      case 'calculate':
                        // 应用计算规则
                        if (rule.formula) {
                          // 支持更复杂的公式计算
                          switch (rule.formula) {
                            case 'value * 2':
                              rowData[key] = rowData[key] * 2;
                              break;
                            case 'value / 2':
                              rowData[key] = rowData[key] / 2;
                              break;
                            case 'value + 100':
                              rowData[key] = rowData[key] + 100;
                              break;
                            case 'value - 50':
                              rowData[key] = rowData[key] - 50;
                              break;
                            case 'round(value)':
                              rowData[key] = Math.round(rowData[key]);
                              break;
                            case 'ceil(value)':
                              rowData[key] = Math.ceil(rowData[key]);
                              break;
                            case 'floor(value)':
                              rowData[key] = Math.floor(rowData[key]);
                              break;
                          }
                        }
                        break;
                      case 'categorize':
                        // 应用分类规则
                        if (rule.categories) {
                          const value = rowData[key];
                          for (const category of rule.categories) {
                            if (category.range && value >= category.range[0] && value <= category.range[1]) {
                              rowData[key] = category.label;
                              break;
                            } else if (category.value && value === category.value) {
                              rowData[key] = category.label;
                              break;
                            }
                          }
                        }
                        break;
                      case 'dateFormat':
                        // 应用日期格式化规则
                        if (rule.format) {
                          const date = new Date(rowData[key]);
                          switch (rule.format) {
                            case 'YYYY-MM-DD':
                              rowData[key] = date.toISOString().split('T')[0];
                              break;
                            case 'YYYY/MM/DD':
                              rowData[key] = date.toISOString().split('T')[0].replace(/-/g, '/');
                              break;
                            case 'MM-DD-YYYY':
                              const [year, month, day] = date.toISOString().split('T')[0].split('-');
                              rowData[key] = `${month}-${day}-${year}`;
                              break;
                          }
                        }
                        break;
                      case 'textTransform':
                        // 应用文本转换规则
                        if (rule.transform) {
                          const text = rowData[key];
                          switch (rule.transform) {
                            case 'uppercase':
                              rowData[key] = text.toUpperCase();
                              break;
                            case 'lowercase':
                              rowData[key] = text.toLowerCase();
                              break;
                            case 'capitalize':
                              rowData[key] = text.charAt(0).toUpperCase() + text.slice(1).toLowerCase();
                              break;
                          }
                        }
                        break;
                    }
                  }
                });
              }
              
              // 支持计算新列
              if (options.calculatedColumns) {
                Object.keys(options.calculatedColumns).forEach(newCol => {
                  const formula = options.calculatedColumns[newCol];
                  try {
                    // 简单的公式计算
                    if (formula === 'value * 2') {
                      rowData[newCol] = rowData.value * 2;
                    } else if (formula === 'value + 100') {
                      rowData[newCol] = rowData.value + 100;
                    } else if (formula === 'value * 0.8') {
                      rowData[newCol] = rowData.value * 0.8;
                    }
                  } catch (e) {

                    rowData[newCol] = '';
                  }
                });
              }
              
              mergedData.push(rowData);
            });
          });
          
          console.log('合并后数据总量:', mergedData.length);
          
          // 支持数据过滤
          let filteredData = mergedData;
          if (options.filters) {
            filteredData = mergedData.filter(item => {
              for (const [column, condition] of Object.entries(options.filters)) {
                if (item.hasOwnProperty(column)) {
                  const value = item[column];
                  if (condition.type === 'greaterThan' && value <= condition.value) {
                    return false;
                  } else if (condition.type === 'lessThan' && value >= condition.value) {
                    return false;
                  } else if (condition.type === 'equalTo' && value !== condition.value) {
                    return false;
                  } else if (condition.type === 'contains' && !value.includes(condition.value)) {
                    return false;
                  }
                }
              }
              return true;
            });
            console.log('过滤后数据量:', filteredData.length);
          }
          
          // 支持数据排序
          if (options.sortBy) {
            filteredData.sort((a, b) => {
              const sortField = options.sortBy.field;
              const sortOrder = options.sortBy.order || 'asc';
              if (a[sortField] < b[sortField]) {
                return sortOrder === 'asc' ? -1 : 1;
              }
              if (a[sortField] > b[sortField]) {
                return sortOrder === 'asc' ? 1 : -1;
              }
              return 0;
            });
          }
          
          // 模拟写入Excel文件
          let excelContent = allColumnNames.join(',') + '\n';
          filteredData.forEach(item => {
            const row = allColumnNames.map(col => {
              // 根据列名获取对应的数据

                  return item.name;
                case '数值':

                case '日期':

                default:

              }
            });
            excelContent += row.join(',') + '\n';
          });
          
          console.log('Excel内容长度:', excelContent.length);
          
          // 创建下载链接
          const blob = new Blob([excelContent], { type: 'text/csv;charset=utf-8;' });
          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = filename.replace('.xlsx', '.csv');
          console.log('触发下载，文件名:', link.download);
          link.click();
          
          // 使用新的消息格式显示文件信息
          addMessage('ai', {

            records: filteredData.length,
            options: options

    // 记忆系统 - 智能体的核心组件之一
    class MemorySystem {
      constructor() {
        this.shortTermMemory = []; // 短期记忆，存储最近的对话和事件
        this.longTermMemory = new Map(); // 长期记忆，存储重要的信息
        this.episodicMemory = []; // 情景记忆，存储特定场景的记忆
        this.semanticMemory = new Map(); // 语义记忆，存储事实和概念
        this.proceduralMemory = new Map(); // 程序记忆，存储如何执行任务的记忆
        this.maxShortTermMemorySize = 50; // 短期记忆最大容量
        this.initializeSemanticMemory();
        this.initializeProceduralMemory();
      }
      
      // 初始化语义记忆
      initializeSemanticMemory() {
        this.semanticMemory.set('excel_file_format', 'Excel文件格式包括.xlsx和.xls');
        this.semanticMemory.set('data_analysis', '数据分析是指对数据进行统计、汇总和可视化的过程');
        this.semanticMemory.set('data_cleaning', '数据清洗是指处理数据中的空值、重复值和异常值');
        this.semanticMemory.set('data_visualization', '数据可视化是指将数据转化为图表等视觉形式');
        this.semanticMemory.set('pivot_table', '数据透视表是一种交互式的表格，可以对数据进行多维度分析');
      }
      
      // 初始化程序记忆
      initializeProceduralMemory() {
        this.proceduralMemory.set('read_excel', '读取Excel文件的步骤：1. 选择文件 2. 解析文件 3. 提取数据');
        this.proceduralMemory.set('analyze_data', '分析数据的步骤：1. 了解数据结构 2. 执行统计分析 3. 生成可视化结果 4. 提供洞察');
        this.proceduralMemory.set('generate_excel', '生成Excel文件的步骤：1. 准备数据 2. 设置格式 3. 写入文件 4. 保存到指定路径');
      }
      
      // 添加短期记忆
      addShortTermMemory(content, type = 'general') {
        const memory = {
          id: `st_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`,
          content,
          type,
          timestamp: new Date(),
          priority: this.calculatePriority(content, type)
        };
        
        this.shortTermMemory.push(memory);
        
        // 保持短期记忆在容量限制内
        if (this.shortTermMemory.length > this.maxShortTermMemorySize) {
          this.shortTermMemory.sort((a, b) => b.priority - a.priority);
          this.shortTermMemory = this.shortTermMemory.slice(0, this.maxShortTermMemorySize);
        }
        
        return memory.id;
      }
      
      // 添加长期记忆
      addLongTermMemory(key, content, metadata = {}) {
        this.longTermMemory.set(key, {
          content,
          metadata,
          timestamp: new Date(),
          lastAccessed: new Date()
        });
      }
      
      // 添加情景记忆
      addEpisodicMemory(event, context, outcome) {
        const memory = {
          id: `ep_${Date.now()}`,
          event,
          context,
          outcome,
          timestamp: new Date(),
          emotionalValence: this.calculateEmotionalValence(outcome)
        };
        
        this.episodicMemory.push(memory);
        return memory.id;
      }
      
      // 添加语义记忆
      addSemanticMemory(key, content) {
        this.semanticMemory.set(key, content);
      }
      
      // 添加程序记忆
      addProceduralMemory(key, procedure) {
        this.proceduralMemory.set(key, procedure);
      }
      
      // 获取短期记忆
      getShortTermMemory(limit = 10) {
        return this.shortTermMemory
          .sort((a, b) => b.timestamp - a.timestamp)
          .slice(0, limit);
      }
      
      // 获取长期记忆
      getLongTermMemory(key) {
        const memory = this.longTermMemory.get(key);
        if (memory) {
          memory.lastAccessed = new Date();
        }
        return memory;
      }
      
      // 获取情景记忆
      getEpisodicMemory(eventType, limit = 5) {
        return this.episodicMemory
          .filter(memory => memory.event.includes(eventType))
          .sort((a, b) => b.timestamp - a.timestamp)
          .slice(0, limit);
      }
      
      // 获取语义记忆
      getSemanticMemory(key) {
        return this.semanticMemory.get(key);
      }
      
      // 获取程序记忆
      getProceduralMemory(key) {
        return this.proceduralMemory.get(key);
      }
      
      // 搜索记忆
      searchMemory(query, memoryTypes = ['shortTerm', 'longTerm', 'semantic']) {
        const results = [];
        
        if (memoryTypes.includes('shortTerm')) {
          this.shortTermMemory.forEach(memory => {
            if (memory.content.toLowerCase().includes(query.toLowerCase())) {
              results.push({ type: 'shortTerm', ...memory });
            }
          });
        }
        
        if (memoryTypes.includes('longTerm')) {
          this.longTermMemory.forEach((memory, key) => {
            if (key.toLowerCase().includes(query.toLowerCase()) || 
                memory.content.toLowerCase().includes(query.toLowerCase())) {
              results.push({ type: 'longTerm', key, ...memory });
            }
          });
        }
        
        if (memoryTypes.includes('semantic')) {
          this.semanticMemory.forEach((content, key) => {
            if (key.toLowerCase().includes(query.toLowerCase()) || 
                content.toLowerCase().includes(query.toLowerCase())) {
              results.push({ type: 'semantic', key, content });
            }
          });
        }
        
        return results.sort((a, b) => b.timestamp - a.timestamp);
      }
      
      // 计算记忆优先级
      calculatePriority(content, type) {
        let priority = 0.5;
        
        // 根据类型调整优先级
        if (type === 'error') priority = 0.9;
        if (type === 'success') priority = 0.7;
        if (type === 'question') priority = 0.8;
        
        // 根据内容长度和重要性调整优先级
        if (content.length > 100) priority += 0.1;
        if (content.includes('重要') || content.includes('紧急')) priority += 0.2;
        
        return Math.min(priority, 1.0);
      }
      
      // 计算情绪 valence
      calculateEmotionalValence(outcome) {
        const positiveWords = ['成功', '完成', '好', '优秀', '满意', '正确'];
        const negativeWords = ['失败', '错误', '问题', '异常', '不满意', '错误'];
        
        let valence = 0;
        
        positiveWords.forEach(word => {
          if (outcome.includes(word)) valence += 1;
        });
        
        negativeWords.forEach(word => {
          if (outcome.includes(word)) valence -= 1;
        });
        
        return valence;
      }
      
      // 遗忘机制
      forget(force = false) {
        // 遗忘低优先级的短期记忆
        if (force || this.shortTermMemory.length > this.maxShortTermMemorySize * 0.8) {
          this.shortTermMemory.sort((a, b) => a.priority - b.priority);
          this.shortTermMemory = this.shortTermMemory.slice(Math.floor(this.shortTermMemory.length * 0.3));
        }
        
        // 遗忘长期未访问的长期记忆
        const now = new Date();
        const expiredKeys = [];
        
        this.longTermMemory.forEach((memory, key) => {
          const daysSinceAccess = (now - memory.lastAccessed) / (1000 * 60 * 60 * 24);
          if (daysSinceAccess > 30) {
            expiredKeys.push(key);
          }
        });
        
        expiredKeys.forEach(key => this.longTermMemory.delete(key));
      }
      
      // 记忆增强
      strengthenMemory(memoryId) {
        // 增强短期记忆
        const shortTermIndex = this.shortTermMemory.findIndex(m => m.id === memoryId);
        if (shortTermIndex !== -1) {
          this.shortTermMemory[shortTermIndex].priority = Math.min(this.shortTermMemory[shortTermIndex].priority + 0.2, 1.0);
        }
      }
    }

      // 生成计划
      generatePlan(goal, context = {}, options = {}) {
        const planId = `plan_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
        
        // 选择合适的计划模板
        let template = this.selectPlanTemplate(goal, context);
        
        // 创建计划实例
        const plan = {
          id: planId,
          goal,
          context,
          templateId: template.id,
          name: template.name,
          description: template.description,
          steps: this.createPlanSteps(template.steps, context),
          status: 'created', // created, in_progress, completed, failed
          progress: 0,
          startTime: null,
          endTime: null,
          estimatedTime: template.estimatedTime,
          actualTime: 0,
          results: {},
          errors: [],
          priority: options.priority || 1,
          riskLevel: this.assessRiskLevel(goal, context),
          dependencies: options.dependencies || []
        };
        
        this.plans.set(planId, plan);
        return plan;
      }
      
      // 选择合适的计划模板
      selectPlanTemplate(goal, context) {
        const goalLower = goal.toLowerCase();
        
        // 根据目标选择模板
        if (goalLower.includes('分析') && goalLower.includes('excel')) {
          return this.planTemplates.get('excel_analysis');
        } else if (goalLower.includes('清洗') || goalLower.includes('清理')) {
          return this.planTemplates.get('data_cleaning');
        } else if (goalLower.includes('导出') || goalLower.includes('生成') || goalLower.includes('创建')) {
          return this.planTemplates.get('data_export');
        } else {
          return this.planTemplates.get('general_office');
        }
      }
      
      // 创建计划步骤
      createPlanSteps(templateSteps, context) {
        return templateSteps.map((stepTemplate, index) => ({
          ...stepTemplate,
          status: 'pending', // pending, in_progress, completed, failed
          startTime: null,
          endTime: null,
          actualTime: 0,
          results: null,
          error: null,
          order: index + 1
        }));
      }
      
      // 执行计划
      async executePlan(planId, toolManager, options = {}) {
        const plan = this.plans.get(planId);
        if (!plan) {
          throw new Error(`计划 ${planId} 不存在`);
        }
        
        // 更新计划状态
        plan.status = 'in_progress';
        plan.startTime = new Date();
        
        try {
          // 执行每个步骤
          for (const step of plan.steps) {
            if (step.required || options.includeOptionalSteps) {
              step.status = 'in_progress';
              step.startTime = new Date();
              
              try {
                // 执行步骤
                const stepResult = await this.executeStep(step, plan, toolManager, options);
                step.results = stepResult;
                step.status = 'completed';
                step.endTime = new Date();
                step.actualTime = step.endTime - step.startTime;
                
                // 更新计划进度
                plan.progress = this.calculatePlanProgress(plan);
                
                // 记录成功执行
                this.recordExecution(plan, step, 'success', stepResult);
                
                // 添加到记忆系统
                this.memorySystem.addShortTermMemory(
                  `步骤 ${step.name} 执行成功: ${JSON.stringify(stepResult)}`,
                  'success'
                );
              } catch (error) {
                step.error = error.message;
                step.status = 'failed';
                step.endTime = new Date();
                step.actualTime = step.endTime - step.startTime;
                
                // 记录执行失败
                this.recordExecution(plan, step, 'failed', error.message);
                
                // 添加到记忆系统
                this.memorySystem.addShortTermMemory(
                  `步骤 ${step.name} 执行失败: ${error.message}`,
                  'error'
                );
                
                // 如果是关键步骤失败，整个计划失败
                if (step.required) {
                  throw error;
                }
              }
            }
          }
          
          // 计划执行完成
          plan.status = 'completed';
          plan.endTime = new Date();
          plan.actualTime = plan.endTime - plan.startTime;
          
          // 记录成功执行
          this.recordExecution(plan, null, 'success', '计划执行完成');
          
          // 添加到记忆系统
          this.memorySystem.addShortTermMemory(

          this.memorySystem.addShortTermMemory(

    // 反思系统 - 智能体的核心组件之一
    class ReflectionSystem {
      constructor(memorySystem) {
        this.memorySystem = memorySystem;
        this.reflections = [];
      }
      
      // 自我评估
      selfEvaluate(executionResult) {
        // 简单的自我评估
        const evaluation = {
          success: executionResult.status === 'completed',
          efficiency: this.calculateEfficiency(executionResult),
          accuracy: this.calculateAccuracy(executionResult),
          areasForImprovement: this.identifyAreasForImprovement(executionResult)
        };
        
        // 添加到反思记录
        this.reflections.push({
          evaluation,
          executionResult,
          timestamp: new Date()
        });
        
        return evaluation;
      }
      
      // 计算执行效率
      calculateEfficiency(executionResult) {
        // 简单的效率计算
        const estimatedTime = executionResult.estimatedTime;
        const actualTime = executionResult.actualTime;
        return Math.min(1.0, estimatedTime / Math.max(actualTime, 1));
      }
      
      // 计算执行准确性
      calculateAccuracy(executionResult) {
        // 简单的准确性计算
        const errorCount = executionResult.errors.length;
        return Math.max(0, 1 - (errorCount * 0.2));
      }
      
      // 识别改进领域
      identifyAreasForImprovement(executionResult) {
        const areas = [];
        if (executionResult.actualTime > executionResult.estimatedTime * 1.5) {
          areas.push('执行速度');
        }
        if (executionResult.errors.length > 0) {
          areas.push('错误处理');
        }
        return areas;
      }
    }

        const taskId = `task_${Date.now()}`;
        this.tasks.set(taskId, {
          id: taskId,
          description,
          priority,
          status: 'pending',
          createdAt: new Date()
        });

      }
      
      // 执行任务
      executeTask(taskId) {
        const task = this.tasks.get(taskId);

          task.status = 'completed';
          task.completedAt = new Date();
        }
        return task;
      }
