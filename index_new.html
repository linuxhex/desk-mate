<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeskMate - 智能办公助手</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    .container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    
    .sidebar {
      width: 280px;
      background: #252526;
      border-right: 1px solid #333;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }
    
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    .header {
      padding: 20px;
      background: #252526;
      border-bottom: 1px solid #333;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .logo {
      font-size: 24px;
      font-weight: 700;
      color: #667eea;
    }
    
    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    
    .message {
      max-width: 80%;
      padding: 16px 20px;
      border-radius: 12px;
      animation: fadeIn 0.3s ease;
    }
    
    .message.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    
    .message.ai {
      align-self: flex-start;
      background: #2d2d2d;
      border: 1px solid #404040;
    }
    
    .input-container {
      padding: 20px;
      background: #252526;
      border-top: 1px solid #333;
    }
    
    .input-wrapper {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    
    .chat-input {
      flex: 1;
      padding: 14px 18px;
      border: 1px solid #404040;
      border-radius: 8px;
      background: #1a1a2e;
      color: #e0e0e0;
      font-size: 14px;
      outline: none;
      transition: all 0.3s ease;
    }
    
    .chat-input:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
    }
    
    .send-btn {
      padding: 14px 28px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .send-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }
    
    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    
    .sidebar-item {
      padding: 12px 16px;
      margin-bottom: 8px;
      border-radius: 8px;
      background: #2d2d2d;
      border: 1px solid #404040;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .sidebar-item:hover {
      background: #3d3d3d;
      border-color: #667eea;
      transform: translateX(4px);
    }
    
    .sidebar-item.active {
      background: #3d3d3d;
      border-color: #667eea;
    }
    
    .sidebar-icon {
      font-size: 20px;
    }
    
    .sidebar-text {
      font-size: 14px;
      font-weight: 500;
    }
    
    .loading {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      background: rgba(102, 126, 234, 0.1);
      border-radius: 8px;
    }
    
    .loading-spinner {
      width: 20px;
      height: 20px;
      border: 2px solid #667eea;
      border-top: 2px solid transparent;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .file-list {
      margin-top: 20px;
      padding: 16px;
      background: #2d2d2d;
      border-radius: 8px;
      border: 1px solid #404040;
    }
    
    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      margin-bottom: 8px;
      background: #1a1a2e;
      border-radius: 6px;
    }
    
    .file-name {
      font-size: 14px;
      font-weight: 500;
    }
    
    .file-size {
      font-size: 12px;
      color: #888;
    }
    
    .delete-btn {
      padding: 6px 12px;
      background: #ff6b6b;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .delete-btn:hover {
      background: #ff5252;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <div class="logo">🚀 DeskMate</div>
      
      <div class="sidebar-item active">
        <span class="sidebar-icon">💬</span>
        <span class="sidebar-text">对话</span>
      </div>
      
      <div class="sidebar-item">
        <span class="sidebar-icon">📁</span>
        <span class="sidebar-text">文件</span>
      </div>
      
      <div class="sidebar-item">
        <span class="sidebar-icon">📊</span>
        <span class="sidebar-text">分析</span>
      </div>
      
      <div class="sidebar-item">
        <span class="sidebar-icon">📧</span>
        <span class="sidebar-text">设置</span>
      </div>
      
      <div class="file-list">
        <div style="font-size: 12px; color: #888; margin-bottom: 12px;">已上传文件</div>
        <div id="file-items"></div>
      </div>
    </div>
    
    <div class="main-content">
      <div class="header">
        <div class="logo">🚀 DeskMate</div>
        <div style="font-size: 14px; color: #888;">智能办公助手</div>
      </div>
      
      <div class="chat-container">
        <div class="messages" id="messages"></div>
        
        <div class="input-container">
          <div class="input-wrapper">
            <input type="text" class="chat-input" id="chat-input" placeholder="输入您的消息..." autocomplete="off">
            <button class="send-btn" id="send-btn" onclick="sendMessage()">发送</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <script>
    // 全局变量
    let selectedFiles = [];
    let excelDataList = [];
    let columnNamesList = [];
    let conversationHistory = [];
    
    // 添加消息到聊天界面
    function addMessage(type, content) {
      const messagesDiv = document.getElementById('messages');
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${type}`;
      
      // 处理不同类型的消息
      if (type === 'loading') {
        messageDiv.innerHTML = `
          <div class="loading">
            <div class="loading-spinner"></div>
            <span>${content}</span>
          </div>
        `;
      } else {
        // 处理普通文本消息
        const formattedContent = content.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                                       .replace(/\n/g, '<br>');
        messageDiv.innerHTML = `
          <div style="font-size: 14px; line-height: 1.6;">
            ${formattedContent}
          </div>
        `;
      }
      
      messagesDiv.appendChild(messageDiv);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
      
      // 添加到对话历史
      conversationHistory.push({
        type: type,
        content: content,
        timestamp: new Date()
      });
    }
    
    // 发送消息
    async function sendMessage() {
      const input = document.getElementById('chat-input');
      const sendBtn = document.getElementById('send-btn');
      const message = input.value.trim();
      
      if (!message) {
        return;
      }
      
      // 添加用户消息
      addMessage('user', message);
      input.value = '';
      sendBtn.disabled = true;
      
      // 显示加载状态
      addMessage('ai', '正在思考...');
      
      try {
        // 调用Python智能体
        const result = await window.electronAPI.callPythonAgent(message, {
          files: selectedFiles.map(f => f.name),
          data: excelDataList
        });
        
        // 显示结果
        if (result.success) {
          addMessage('ai', result.result);
        } else {
          addMessage('ai', `处理失败: ${result.error}`);
        }
      } catch (error) {
        console.error('处理失败:', error);
        addMessage('ai', `处理失败: ${error.message}`);
      }
      
      sendBtn.disabled = false;
    }
    
    // 上传文件
    async function uploadFiles() {
      const result = await window.electronAPI.openFileDialog();
      if (result) {
        const file = {
          name: result.split(/[/\\]/).pop(),
          path: result
        };
        selectedFiles.push(file);
        updateFileList();
        addMessage('ai', `文件已上传: ${file.name}`);
      }
    }
    
    // 更新文件列表
    function updateFileList() {
      const fileItemsDiv = document.getElementById('file-items');
      fileItemsDiv.innerHTML = '';
      
      selectedFiles.forEach((file, index) => {
        const fileItem = document.createElement('div');
        fileItem.className = 'file-item';
        fileItem.innerHTML = `
          <div>
            <div class="file-name">${file.name}</div>
            <div class="file-size">${file.path}</div>
          </div>
          <button class="delete-btn" onclick="deleteFile(${index})">删除</button>
        `;
        fileItemsDiv.appendChild(fileItem);
      });
    }
    
    // 删除文件
    function deleteFile(index) {
      selectedFiles.splice(index, 1);
      updateFileList();
      addMessage('ai', '文件已删除');
    }
    
    // 键盘事件
    document.getElementById('chat-input').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        sendMessage();
      }
    });
    
    // 初始化
    window.addEventListener('DOMContentLoaded', function() {
      addMessage('ai', '你好！我是DeskMate，你的智能办公助手。我可以帮你处理Excel文件、分析数据、生成报告等任务。请上传文件或直接告诉我你的需求。');
    });
  </script>
</body>
</html>
