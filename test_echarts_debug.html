<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ECharts测试页面</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #0d1117;
      color: #c9d1d9;
    }
    .test-container {
      max-width: 800px;
      margin: 0 auto;
    }
    .test-section {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .test-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
      color: #58a6ff;
    }
    .chart-container {
      width: 100%;
      height: 400px;
      margin-top: 16px;
    }
    .log-container {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 4px;
      padding: 10px;
      margin-top: 10px;
      font-family: monospace;
      font-size: 12px;
      max-height: 200px;
      overflow-y: auto;
    }
    button {
      background: #238636;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 10px 20px;
      cursor: pointer;
      font-size: 14px;
      margin-right: 10px;
    }
    button:hover {
      background: #2ea043;
    }
  </style>
</head>
<body>
  <div class="test-container">
    <h1>ECharts测试页面</h1>
    
    <div class="test-section">
      <div class="test-title">1. ECharts库加载测试</div>
      <div id="echarts-status"></div>
    </div>
    
    <div class="test-section">
      <div class="test-title">2. 漏斗图测试</div>
      <div id="funnel-chart" class="chart-container"></div>
      <button onclick="testFunnelChart()">测试漏斗图</button>
    </div>
    
    <div class="test-section">
      <div class="test-title">3. 数据解析测试</div>
      <div id="data-status"></div>
      <button onclick="testDataParsing()">测试数据解析</button>
    </div>
    
    <div class="test-section">
      <div class="test-title">4. 完整流程测试</div>
      <div id="full-test-chart" class="chart-container"></div>
      <button onclick="testFullProcess()">测试完整流程</button>
    </div>
    
    <div class="test-section">
      <div class="test-title">5. 日志输出</div>
      <div id="log-output" class="log-container"></div>
      <button onclick="clearLog()">清空日志</button>
    </div>
  </div>
  
  <script>
    function log(message) {
      const logOutput = document.getElementById('log-output');
      const time = new Date().toLocaleTimeString();
      logOutput.innerHTML += `[${time}] ${message}<br>`;
      logOutput.scrollTop = logOutput.scrollHeight;
      console.log(message);
    }
    
    function clearLog() {
      document.getElementById('log-output').innerHTML = '';
    }
    
    // 测试ECharts库加载
    function testEChartsLoading() {
      const statusDiv = document.getElementById('echarts-status');
      if (typeof echarts !== 'undefined') {
        statusDiv.innerHTML = '<span style="color: #238636;">✓ ECharts库已成功加载</span>';
        log('ECharts库已成功加载');
      } else {
        statusDiv.innerHTML = '<span style="color: #da3633;">✗ ECharts库未加载</span>';
        log('ECharts库未加载');
      }
    }
    
    // 测试漏斗图
    function testFunnelChart() {
      log('开始测试漏斗图...');
      
      const chartDom = document.getElementById('funnel-chart');
      if (!chartDom) {
        log('错误：找不到图表容器');
        return;
      }
      
      if (typeof echarts === 'undefined') {
        log('错误：ECharts库未加载');
        return;
      }
      
      const myChart = echarts.init(chartDom);
      log('ECharts实例创建成功');
      
      const option = {
        title: { text: '信息流线索跟进转化漏斗分析', left: 'center', textStyle: { color: '#c9d1d9' } },
        tooltip: {
          trigger: 'item',
          formatter: function(params) {
            return `${params.name}: ${params.value} (${params.data.rate || 0}%)`;
          }
        },
        series: [{
          type: 'funnel',
          data: [
            { name: '总线索量', value: 3, rate: 100 },
            { name: '接通', value: 1, rate: 33.33 },
            { name: '添加微信', value: 1, rate: 100 },
            { name: '有效意向', value: 0, rate: 0 },
            { name: '高概率成交', value: 0, rate: 0 }
          ],
          label: {
            color: '#c9d1d9',
            formatter: function(params) {
              return `${params.name}\n${params.value} (${params.data.rate || 0}%)`;
            }
          },
          itemStyle: {
            color: '#58a6ff',
            opacity: 0.8
          }
        }]
      };
      
      myChart.setOption(option);
      log('漏斗图渲染成功');
    }
    
    // 测试数据解析
    function testDataParsing() {
      log('开始测试数据解析...');
      
      const testData = '[ECHARTS:{"chart_type":"funnel","title":"信息流线索跟进转化漏斗分析","reason":"数据包含转化漏斗信息，推荐使用漏斗图","data":[{"name":"总线索量","value":3,"rate":100},{"name":"接通","value":1,"rate":33.33},{"name":"添加微信","value":1,"rate":100},{"name":"有效意向","value":0,"rate":0},{"name":"高概率成交","value":0,"rate":0}]}:END_ECHARTS]';
      
      const statusDiv = document.getElementById('data-status');
      
      if (testData.includes('[ECHARTS:') && testData.includes(':END_ECHARTS]')) {
        log('检测到ECHARTS格式的数据');
        
        const chartMatch = testData.match(/\[ECHARTS:(.*?):END_ECHARTS\]/);
        if (chartMatch) {
          log('成功提取图表配置数据');
          
          try {
            const chartConfig = JSON.parse(chartMatch[1]);
            log('成功解析图表配置JSON');
            log(`图表类型: ${chartConfig.chart_type}`);
            log(`图表标题: ${chartConfig.title}`);
            log(`数据项数量: ${chartConfig.data.length}`);
            
            statusDiv.innerHTML = '<span style="color: #238636;">✓ 数据解析成功</span>';
          } catch (e) {
            log('错误：解析JSON失败 - ' + e.message);
            statusDiv.innerHTML = '<span style="color: #da3633;">✗ 数据解析失败</span>';
          }
        } else {
          log('错误：无法提取图表配置数据');
          statusDiv.innerHTML = '<span style="color: #da3633;">✗ 数据提取失败</span>';
        }
      } else {
        log('错误：未检测到ECHARTS格式的数据');
        statusDiv.innerHTML = '<span style="color: #da3633;">✗ 未检测到ECHARTS格式</span>';
      }
    }
    
    // 测试完整流程
    function testFullProcess() {
      log('开始测试完整流程...');
      
      const chartDom = document.getElementById('full-test-chart');
      if (!chartDom) {
        log('错误：找不到图表容器');
        return;
      }
      
      if (typeof echarts === 'undefined') {
        log('错误：ECharts库未加载');
        return;
      }
      
      // 模拟从后端接收的数据
      const mockResponse = '[ECHARTS:{"chart_type":"funnel","title":"信息流线索跟进转化漏斗分析","reason":"数据包含转化漏斗信息，推荐使用漏斗图","data":[{"name":"总线索量","value":3,"rate":100},{"name":"接通","value":1,"rate":33.33},{"name":"添加微信","value":1,"rate":100},{"name":"有效意向","value":0,"rate":0},{"name":"高概率成交","value":0,"rate":0}]}:END_ECHARTS]';
      
      log('模拟接收到后端数据');
      
      // 检查是否包含图表数据
      if (mockResponse.includes('[ECHARTS:') && mockResponse.includes(':END_ECHARTS]')) {
        log('检测到ECHARTS格式的数据');
        
        const chartMatch = mockResponse.match(/\[ECHARTS:(.*?):END_ECHARTS\]/);
        if (chartMatch) {
          try {
            const chartConfig = JSON.parse(chartMatch[1]);
            log('成功解析图表配置');
            
            // 创建图表
            const myChart = echarts.init(chartDom);
            log('ECharts实例创建成功');
            
            const option = {
              title: { text: chartConfig.title, left: 'center', textStyle: { color: '#c9d1d9' } },
              tooltip: {
                trigger: 'item',
                formatter: function(params) {
                  return `${params.name}: ${params.value} (${params.data.rate || 0}%)`;
                }
              },
              series: [{
                type: 'funnel',
                data: chartConfig.data,
                label: {
                  color: '#c9d1d9',
                  formatter: function(params) {
                    return `${params.name}\n${params.value} (${params.data.rate || 0}%)`;
                  }
                },
                itemStyle: {
                  color: '#58a6ff',
                  opacity: 0.8
                }
              }]
            };
            
            myChart.setOption(option);
            log('完整流程测试成功，图表已渲染');
          } catch (e) {
            log('错误：' + e.message);
          }
        }
      }
    }
    
    // 页面加载完成后自动测试
    window.addEventListener('DOMContentLoaded', function() {
      log('页面加载完成');
      testEChartsLoading();
    });
  </script>
</body>
</html>
